# PyPSA-GB: what to run.
#
# The configuration is layered (config/README.md):
#   config/defaults/       defaults for every scenario: the base, then the overlays a scenario's targets, method and
#                          dispatch select (method/, source/, dispatch/)
#   config/scenarios.yaml  the canonical scenarios: tutorials, examples and quick tests
#   config/studies/<name>/ larger studies, solved month by month (families), loaded when listed under `studies`
#   config/clustering.yaml network clustering presets; config/cutouts_config.yaml weather cutouts (Snakefile_cutouts)
#
# This file says which studies to load and which scenarios to run. Run with `snakemake -j 4`; a dry run is
# `snakemake -n`. Any key below other than `studies` and `run_scenarios` is a global override of the defaults.

# Studies to load (config/studies/<name>/). Loading a study makes its scenarios and month families runnable; it
# runs nothing by itself. The studies are large: a CP30 2030 family is twelve monthly two-stage solves on the full
# ETYS network (days of compute and a commercial solver in practice). See docs: Studies.
studies:
  - tutorials          # the tutorial scenarios (Tutorial_2020_*, Tutorial_2040_HT_clustered); small, one week each
#  - cp30_2030          # NESO Clean Power 2030, Further Flex and Renewables (CP30_FFR_2030_<Mon>_<family>); tutorial 5
#  - fes2050            # FES 2025 Holistic Transition 2050 (FES25_HT_2050_<Mon>_<family>)
#  - fes2040            # FES 2025 Holistic Transition 2040 (FES25_HT_2040_<Mon>_<family>)
#  - validation_2020    # the 2020 validation year (Validation_<Mon>2020)

# Scenarios to run: scenario ids, or a loaded study's family name to run all twelve of its months.
run_scenarios:
  - Test_Market                    # six hours of 2035 on the Reduced network, wholesale market and balancing mechanism

  # ── Tutorials (docs/source/tutorials): 10-16 February in 2020, 2030 and 2040 ────────────────────────────────
  # - Tutorial_2020_reduced        # tutorial 1: 2020 on the Reduced network (32 buses), minutes
  # - Tutorial_2020_zonal          # tutorial 2: the same week on the Zonal network (17 zones)
  # - Tutorial_2020_clustered      # tutorial 2: on the ETYS network clustered to GSP regions
  # - Tutorial_2020_etys           # tutorial 2: on the full ETYS network (about 2,000 buses, 16 GB)
  # - Tutorial_2040_HT_clustered   # tutorial 4: FES 2025 Holistic Transition 2040, clustered ETYS
  # - CP30_FFR_2030_tutorial_week  # tutorial 5: CP30 2030, wholesale market and balancing (load cp30_2030 above)

  # ── Examples from config/scenarios.yaml ────────────────────────────────────────────────────────────────
  # - EE50_clustered               # FES 2025 Electric Engagement 2050, ETYS clustered to 100 buses, one week
  # - HT35_clustered               # FES 2024 Holistic Transition 2035, ETYS clustered to GSP regions, one week
  # - HT35                         # FES 2024 Holistic Transition 2035, full ETYS network
  # - HT35_flex                    # as HT35, with EV flexibility
  # - HT30_event_response          # FES 2025 HT 2030, clustered ETYS, with event response
  # - HT35_market                  # HT 2035 on ETYS, wholesale market and balancing mechanism
  # - Historical_2015_reduced      # 2015 on the Reduced network (32 buses), one week
  # - Historical_2023_etys         # 2023 on the full ETYS network, a high-renewables week
  # - Historical_2024_market       # 2024, wholesale market and balancing mechanism

  # ── Study families (load the study above first) ─────────────────────────────────────────────────────────
  # CP30 2030: network cases no_acceleration (central), cp30_network (recommended network), no_upgrades
  # - no_acceleration
  # - cp30_network
  # - no_upgrades
  # FES 2025 Holistic Transition 2040 and 2050: the market years
  # - fes2040:market
  # - fes2050:market
  # 2020 validation
  # - validation
