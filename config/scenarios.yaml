          - ESTEX
          - SEIMP
          - SWALEX
      line_rating_overrides:
        CLUN1T_ERRO1J_0: 180
        ERRO1T_KIIN1-_0: 180
        INVR1C_KIIN1-_0: 120
        INVR1A_INVR1C_0: 120
        INVR1-_INVR1A_0: 120
        INVR1-_SLOY1K_0: 120
        GARB1T_SLOY1K_1: 120
        GARB1T_GARE1T_0: 120
        GARE1T_WIYH1-_0: 120
        BIHI1R_COUA1R_0: 180
        BIHI1R_TEAL1-_0: 120
  solve_period:
    enabled: true
    start: 2020-01-07 00:00
    end: 2020-01-07 23:30
  support:
    labels:
      enabled: true
    dispatch_costs:
      enabled: true
  market:
    enabled: true
    wholesale:
      mode: rolling_day_ahead
      scarcity_pricing:
        enabled: false   # the curve is calibrated on 2024 and overshoots in 2020 (as the validation_2020 study)
    balancing:
      mode: rolling
      participation:
        generators:
          min_p_nom_mw: 1.0
          exclude_carriers:
          - load_shedding
          - embedded_solar
          - embedded_wind
          penalty_offer_price: 6000.0
          penalty_bid_price: 6000.0
          behavior: fallback_priced
      elexon:
        price_ladders:
          enabled: true
      window_hours: 0.5
  modelled_year: 2020
  network_model: ETYS
  marginal_costs:
    empirical_calibration:
      enabled: true
    biofuel_subsidy:
      enabled: true
  thermal:
    availability_factors:
      enabled: true
  timestep_minutes: 30
