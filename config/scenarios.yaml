# PyPSA-GB scenarios: the canonical set.
#
# Each scenario is merged over the defaults (config/defaults/: the base, then the overlays its targets,
# method and dispatch select) and lists only what differs. Studies (config/studies/<name>/) hold the
# larger month-by-month studies; config.yaml says which studies to load and which scenarios to run.
# Scenarios retired from this file are in config/studies/archive/canonical/ (ids unchanged).
#
# Each scenario writes targets: {source, edition, pathway} (where the numbers come from) and method
# (brownfield | gsp_block | historical: how the fleet is built), so any entry can be copied under a new id;
# the loader fills FES_year and FES_scenario from targets. Only the ids in
# data/scenario_sources/legacy_scenario_ids.txt may leave both out.

