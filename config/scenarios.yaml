  fleet:
    commissioning:
      profile_gate_within_solve_period: true
  consumer_bill:
    price_cap:
      enabled: true
      input_mode: historical_backtest
      data_bundle: data/market/ofgem_price_cap/2024_annual
      source_manifest: data/market/consumer_bill_sources/2024.yaml
      historical_report_evidence:
        model_signals_csv: resources/analysis/Historical_2024_ETYS_14zone_market_pypsa_bill_signals.csv
        cfd_reconciliation_json: resources/analysis/Historical_2024_ETYS_14zone_market_lccc_cfd_model_dispatch_reconciliation_summary.json
        cfd_mapping_json: resources/analysis/Historical_2024_ETYS_14zone_market_lccc_cfd_contract_mapping_summary.json
        procurement_bridge_csv: resources/analysis/Historical_2024_ETYS_14zone_market_pypsa_spot_procurement_bridge.csv
        comparison_register_csv: resources/analysis/Historical_2024_ETYS_14zone_market_ofgem_benchmark_component_register.csv
      historical_comparison:
        support_recovery_method: modelled_system_demand_proxy
      annual_consumption_kwh:
      - 3100
      cost_stack:
        enabled: true
      forward_procurement:
        method: pypsa_spot_to_procurement_raw_backtest
        spot_multiplier: 1.0
        spot_intercept_gbp_per_mwh: 0.0
      historical_support_outturn:
        enabled: true
        detailed_cfd_contract_reconciliation: true
      backtest:
        enabled: true

