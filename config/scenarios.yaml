      method: custom
      function_path: scripts/network_clustering/consumer_bill_14_zone.py
      function_name: cluster_buses
      convert_transformers_to_lines: true
  solve_period:
    enabled: true
    start: 2024-01-01 00:00
    end: 2024-12-31 23:00
