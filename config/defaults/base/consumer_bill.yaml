# Electricity-only consumer-bill reporting: the Ofgem default tariff cap (historical) and the future-bill
# forecast cases, which read completed monthly market outputs and never trigger a solve.
price_cap:
  enabled: false
  mode: "official"                     # Published allowance / validated forward-procurement baseline
  cap_snapshot: "2026_Q3"              # data/market/ofgem_price_cap/{snapshot}
  meter_types: ["single_rate"]         # Multi-register meters are not yet implemented
  payment_methods: ["direct_debit"]    # direct_debit | standard_credit | prepayment
  regions: ["GB_average"]              # GB_average or Ofgem charge-restriction region
  annual_consumption_kwh: [2500]
  vat_rate: 0.05
  cost_stack:
    enabled: false                     # Published hedge + named retail-stack analysis (2020 only)

# Quantile mapping of the model's 2030 hours onto CP30's own price level, NESO CP30 workbook CP.32: each market
# hour keeps its rank and takes CP.32's price at that rank (scripts/consumer_bill/price_level_mapping.py). Read by
# the legacy valuation's price path (lever legacy_price_path) and by forecast cases with price_level: cp32 (a
# static bracket on the price level). Model mean 53.3 GBP/MWh against CP.32's 69.9, the gap in export and
# Code defaults: price_level_mapping.DEFAULT_SETTINGS
# (must match).
price_level_mapping: &price_level_mapping_cp32
  # Sheet CP.32 of data/CP30/Clean Power 2030 Data Workbook_V003.xlsx (Annex 4, Figure 11, "Price duration
  # curve 2030", Baringa for NESO): 101 points.
  source_file: data/CP30/cp32_price_duration_curve_2030.csv
  source: "Clean Power 2030 Data Workbook V003 (NESO, Baringa modelling), sheet CP.32 'Price duration curve 2030' (Annex 4 Figure 11)"
  pathway: further_flex_and_renewables            # our pathway; mean GBP 69.89/MWh
  # 2024 prices: CP.32 states no year; CP30 Annex 4 section 2 rebases all costs to 2024 prices.
  price_year: 2024
  rebasing_to_model_price_year: 1.0

# Future consumer-bill forecast cases (CP30 2030). Each reads twelve solved months (source_scenario_pattern) and
# their annual aggregate (annual_aggregate_study, a monthly_aggregates entry of config/studies/cp30_2030/study.yaml).
forecasts:
  cases:
    # The LOWER network (the recommended CP30 network). Its months bid CfDs at strike minus wholesale with no
    # negative-price rule, and the projector refuses a bill whose CfD rule differs from the bid audit's, so the case
    # reads the cfd_rule_none assumptions.
    CP30_2030_cp30_network: &cp30_2030_cp30_network_forecast_case
      modelled_year: 2030
      model_price_year: 2024
      source_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network"
      assumptions: "data/market/consumer_bill_benchmarks/2030_pypsa_informed_assumptions_cfd_rule_none.json"
      # Sourced recovery denominators: every model-derived component divides by a volume declared here.
      recovery_demand_assumptions: "data/market/consumer_bill_forecast/2030_recovery_demand_assumptions.json"
      # The twelve-month aggregate that owns the annual accounting arithmetic.
      annual_aggregate_study: "CP30_2030_cp30_network"
      # Renewables Obligation scheme parameters, and which Exchequer-relief bookend the bill uses (no default):
      # relief_ends_march_2029 follows government guidance ending the 75% domestic relief in March 2029, making
      # calendar 2030 the first full year of gross recovery.
      ro_scheme_parameters: "data/market/consumer_bill_forecast/2030_ro_scheme_parameters.json"
      ro_relief_case: relief_ends_march_2029
      # Fallback only: the assumptions file's benchmark.period_alignment_note wins (project_future_bill.py).
      period_alignment_note: "Calendar 2030, the year the model dispatches. Model lines are calendar 2030 by construction; every sourced external line declares its own period_basis (calendar_year, calendar_blend, period_average or held_flat_real), and the projector refuses a line without one."
      cfd_recovery:
        # The CfD supplier obligation is levied on eligible supply (net of the EII exemption, from
        # recovery_demand_assumptions), not on total system demand.
        method: eligible_supplier_sales
      # Largest share 0-1 of the gross CfD payment allowed to settle on a carrier-wide future_* strike rather than
      # an allocation-round strike; the case fails above it.
      max_fallback_strike_share_of_payment: 0.01
      # TNUoS as NESO publishes it for the recommended CP30 network (2030_tnuos_network_delivery.json, case cp30).
      tnuos_network_delivery:
        file: data/market/consumer_bill_benchmarks/2030_tnuos_network_delivery.json
        case: cp30
    # The same year with the P2 balancing bids: the state-owned share of each unit bids at cost. The months take
    # their parent month's Stage 1 (wholesale_from), so the case differs only in the balancing stage. Recovery
    # denominators belong to the demand year, so it reads CP30_2030_cp30_network's (recovery_case_id).
    CP30_2030_cp30_network_public_bids_p2:
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network_p2_bids"
      annual_aggregate_study: "CP30_2030_cp30_network_p2_bids"
      recovery_case_id: CP30_2030_cp30_network
    # The same year with the P3 balancing bids: every CfD unit is state-owned and bids at cost, ties ordered by a
    # last-in-first-out step that the constraint line and the settlement net out. Its bill is private on the P3
    # months, the comparator the acquisition tariff on those months replaces.
    CP30_2030_cp30_network_public_bids_p3:
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network_p3_bids"
      annual_aggregate_study: "CP30_2030_cp30_network_p3_bids"
      recovery_case_id: CP30_2030_cp30_network
    # Each case above at CP30's price level (CP.32; price_level_mapping above). Wholesale, procurement, CfD
    # top-ups and interconnector rents move; volumes, the constraint line, RO, LDES and the sourced externals are
    # held as solved (project_future_bill.CP32_HELD_LINES). Each is the forecast case of a price-level twin run
    # group (public_ownership.reference_run_groups.*_cp32), which re-settles its parent group's register at this
    # level. price_level_parent names the model-price case whose months it re-prices.
    CP30_2030_cp30_network_cp32:
      <<: *cp30_2030_cp30_network_forecast_case
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_cp30_network
      recovery_case_id: CP30_2030_cp30_network
    CP30_2030_cp30_network_public_bids_p2_cp32:
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network_p2_bids"
      annual_aggregate_study: "CP30_2030_cp30_network_p2_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_cp30_network_public_bids_p2
      recovery_case_id: CP30_2030_cp30_network
    CP30_2030_cp30_network_public_bids_p3_cp32:
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network_p3_bids"
      annual_aggregate_study: "CP30_2030_cp30_network_p3_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_cp30_network_public_bids_p3
      recovery_case_id: CP30_2030_cp30_network
    # Network bounds: three network-delivery cases, each with its market year, P2 and P3 bid stacks and a CP.32
    # twin of each:
    #   CENTRAL = no_acceleration (NESO's expected network, GBP 7.79 bn of constraint costs): *_no_acceleration;
    #   LOWER   = the recommended CP30 network: CP30_2030_cp30_network* above;
    #   UPPER   = no_upgrades (NESO GBP 12.7 bn): *_no_upgrades.
    # Every month takes its Stage 1 from the shared stage1 family (wholesale_from), so the cases differ only in
    # the balancing stage, and all read CP30_2030_cp30_network's recovery denominators. tnuos_network_delivery
    # moves the TNUoS line to the case's network (data/market/consumer_bill_benchmarks/
    # 2030_tnuos_network_delivery.json: nil on CENTRAL and LOWER, whose TO submissions already carry the
    # projects' 2031 delivery dates; a labelled -10% of onshore TO income on UPPER). register_account_group points
    # the battery top-up line at the network's own market group's public account.
    CP30_2030_no_acceleration: &cp30_2030_no_acceleration_forecast_case
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration"
      annual_aggregate_study: "CP30_2030_no_acceleration"
      recovery_case_id: CP30_2030_cp30_network
      register_account_group: cp30_2030_no_acceleration
      tnuos_network_delivery: &tnuos_no_acceleration
        file: data/market/consumer_bill_benchmarks/2030_tnuos_network_delivery.json
        case: no_acceleration
    CP30_2030_no_acceleration_public_bids_p2:
      <<: *cp30_2030_no_acceleration_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration_p2_bids"
      annual_aggregate_study: "CP30_2030_no_acceleration_p2_bids"
    CP30_2030_no_acceleration_public_bids_p3:
      <<: *cp30_2030_no_acceleration_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration_p3_bids"
      annual_aggregate_study: "CP30_2030_no_acceleration_p3_bids"
    CP30_2030_no_acceleration_cp32:
      <<: *cp30_2030_no_acceleration_forecast_case
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_acceleration
    CP30_2030_no_acceleration_public_bids_p2_cp32:
      <<: *cp30_2030_no_acceleration_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration_p2_bids"
      annual_aggregate_study: "CP30_2030_no_acceleration_p2_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_acceleration_public_bids_p2
    CP30_2030_no_acceleration_public_bids_p3_cp32:
      <<: *cp30_2030_no_acceleration_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration_p3_bids"
      annual_aggregate_study: "CP30_2030_no_acceleration_p3_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_acceleration_public_bids_p3
    # The modelled AR8 round's range (bill layer only): the uncontracted 2030 CfD cohort paid at AR6's clearing
    # prices where lower than the modelled AR8 strike (low) or at AR8's administrative strike prices (high), on
    # the CENTRAL network's months. The balancing solves keep the central strike.
    CP30_2030_no_acceleration_ar8_low:
      <<: *cp30_2030_no_acceleration_forecast_case
      assumptions: "data/market/consumer_bill_benchmarks/2030_pypsa_informed_assumptions_cfd_rule_none_ar8_low.json"
    CP30_2030_no_acceleration_ar8_high:
      <<: *cp30_2030_no_acceleration_forecast_case
      assumptions: "data/market/consumer_bill_benchmarks/2030_pypsa_informed_assumptions_cfd_rule_none_ar8_high.json"
    # The CENTRAL network's year under central dispatch (institution I3, FTI's settlement), the forecast case of
    # the institution twin cp30_2030_no_acceleration_cd (reference_runs.institution_of). It keeps its parent's
    # months: the national price is the market twin's copperplate price, so the wholesale line, demand and
    # annual aggregate are the parent's. The constraint line is the FTI settlement's (fti_settlement: cost
    # recovery + firm access with lost CfD and ROC support + storage and interconnector make-whole + the
    # borrowed forecast-error charge, no re-trading); the CfD line and the RO are metered on the central months
    # (central_scenario_pattern); the cap-and-floor rents move to the central schedule's.
    # counter_trade_premium_on_constraint_line: true adds the central balancing stage's interconnector
    # counter-trade premium to the constraint line; false leaves it in the real-time correction the
    # forecast-error charge replaces (code default true). register_account_group: the twin's own account.
    CP30_2030_no_acceleration_cd:
      <<: *cp30_2030_no_acceleration_forecast_case
      institution: central_dispatch
      institution_parent: CP30_2030_no_acceleration
      central_scenario_pattern: "CP30_FFR_2030_{month}_no_acceleration_central_dispatch"
      fti_settlement: resources/market/CP30_FFR_2030_year_no_acceleration_central_dispatch_fti_settlement_copperplate.csv
      counter_trade_premium_on_constraint_line: true
      register_account_group: cp30_2030_no_acceleration_cd
    # The LOWER network's central-dispatch twin, as CENTRAL's above.
    CP30_2030_cp30_network_cd:
      <<: *cp30_2030_cp30_network_forecast_case
      recovery_case_id: CP30_2030_cp30_network
      institution: central_dispatch
      institution_parent: CP30_2030_cp30_network
      central_scenario_pattern: "CP30_FFR_2030_{month}_cp30_network_central_dispatch"
      fti_settlement: resources/market/CP30_FFR_2030_year_cp30_network_central_dispatch_fti_settlement_copperplate.csv
      counter_trade_premium_on_constraint_line: true
      register_account_group: cp30_2030_cp30_network_cd
    CP30_2030_no_upgrades: &cp30_2030_no_upgrades_forecast_case
      <<: *cp30_2030_cp30_network_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades"
      annual_aggregate_study: "CP30_2030_no_upgrades"
      recovery_case_id: CP30_2030_cp30_network
      register_account_group: cp30_2030_no_upgrades
      tnuos_network_delivery:
        file: data/market/consumer_bill_benchmarks/2030_tnuos_network_delivery.json
        case: no_upgrades
    # The UPPER network's central-dispatch twin, as CENTRAL's above.
    CP30_2030_no_upgrades_cd:
      <<: *cp30_2030_no_upgrades_forecast_case
      institution: central_dispatch
      institution_parent: CP30_2030_no_upgrades
      central_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades_central_dispatch"
      fti_settlement: resources/market/CP30_FFR_2030_year_no_upgrades_central_dispatch_fti_settlement_copperplate.csv
      counter_trade_premium_on_constraint_line: true
      register_account_group: cp30_2030_no_upgrades_cd
    CP30_2030_no_upgrades_public_bids_p2:
      <<: *cp30_2030_no_upgrades_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades_p2_bids"
      annual_aggregate_study: "CP30_2030_no_upgrades_p2_bids"
    CP30_2030_no_upgrades_public_bids_p3:
      <<: *cp30_2030_no_upgrades_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades_p3_bids"
      annual_aggregate_study: "CP30_2030_no_upgrades_p3_bids"
    CP30_2030_no_upgrades_cp32:
      <<: *cp30_2030_no_upgrades_forecast_case
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_upgrades
    CP30_2030_no_upgrades_public_bids_p2_cp32:
      <<: *cp30_2030_no_upgrades_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades_p2_bids"
      annual_aggregate_study: "CP30_2030_no_upgrades_p2_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_upgrades_public_bids_p2
    CP30_2030_no_upgrades_public_bids_p3_cp32:
      <<: *cp30_2030_no_upgrades_forecast_case
      source_scenario_pattern: "CP30_FFR_2030_{month}_no_upgrades_p3_bids"
      annual_aggregate_study: "CP30_2030_no_upgrades_p3_bids"
      price_level: cp32
      price_level_mapping: *price_level_mapping_cp32
      price_level_parent: CP30_2030_no_upgrades_public_bids_p3
