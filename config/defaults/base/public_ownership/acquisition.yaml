# Purchase of the legacy fleet.  Acquisition is switched on by any case whose legacy_fleet
# lever is not private (the fully_nationalised family).  The purchase-price basis, thermal
# basis, annuity term and who pays the annuity are levers (purchase_price_basis,
# thermal_basis, acquisition_term_years, acquisition_financing: the tariff or general
# taxation); this block holds only what they need.
# purchase_price_basis, for renewables and nuclear (the valuation's valued group):
#   state_present_value  each row at its present value to the state, pre-tax at the cash rate
#   market_value         each row at its owners' value, financing workbook v2.0's Approach 2
#                        (after tax and capital allowances, at the post-tax operating rate)
#   book_value, no_support, ro_pass_through
#                        the workbook's A1, A2 without support and A3, on every acquired row
#                        (thermal and storage too)
# thermal_basis, for legacy thermal and storage under the state- and market-value bases:
#   market_value (each row at its owners' value, floored at zero) or zero.
# legacy_price_path, the price after the model year: anchored (central: each technology's
# capture price on a line through today and every solved year, price_anchors below),
# model_2030 (the model's own 2030 price held flat), cp30_level (the asset settlement at
# CP30's CP.32 price level, resources/public_ownership/{run_group}_price_level_settlement.csv)
# or today_level (today's forward price held for the fleet's life).
# Interconnectors: every tariff case (one that buys the legacy fleet) also buys the GB halves
# of the interconnectors, whether or not it buys the wires (GB shares from the bill's
# interconnector_cap_and_floor table).
#   market_value  the GB half's Stage 1 congestion rent (floored at zero per cable) after
#                 corporation tax, times the annuity factor at owner_real_rate over the
#                 cable's remaining years (the workbook's post-tax operating rate for
#                 interconnectors, Legacy Fleet column AF on their Sc1 hurdle; no capital
#                 allowances, as the workbook has no book value for them), annuitised at the
#                 public rate over the case's acquisition term
#   explicit      price_gbp by GB-half rent
# Remaining years per cable: a cap-and-floor cable runs to the end of its regime
# (regime_years from first operation) or of its asset life, whichever comes first; a cable
# outside a regime to the end of its asset life.  First operation from the bill's regime
# table, else commissioning_year_by_cable (DUKES 5.13); remaining_life_years_by_cable is a
# declared override.  Code defaults: IC_ACQUISITION_DEFAULTS in nationalised_tariff.py (must
# match).
interconnectors:
  purchase_price_basis: market_value
  owner_real_rate: 0.0487
  corporation_tax_rate: 0.25
  regime_years: 25.0
  # DNV for NGESO, Network Topology Assessment (6 Mar 2024) p.7: HVDC life ~40 years,
  # major refurbishment ~20 years; National Grid HVDC technical information p.7.
  asset_life_years: 40.0
  commissioning_year_by_cable:
    Britned: 2011
    ElecLink: 2022
  remaining_life_years_by_cable:
    # IFA (1986), declared: no retirement date published; converters replaced 2011-12 (GE
    # case study 2018; RTE IPST 2017 'life extension strategy'); a 25-year converter life
    # from 2012 would give 7 years.
    IFA: 10.0
  price_gbp: null
  # Lever interconnector_price: the owner rate the GB halves are valued at (low price = the
  # higher rate).  A declared +/- 1 pp on the workbook's rate, which gives no range.
  owner_real_rate_by_setting:
    low: 0.0587
    high: 0.0387
# Hinkley Point C completed by the state (in_construction: public_completion): bought at its
# sunk cost and finished on the public cash rate.  The table holds EDF's sourced total and
# sunk cost (2025 URD).  The central case buys it as an operating plant at its contract value.
hpc_completion: data/public_ownership/financing/hpc_completion_cost.csv
# Lever acquisition_transaction_costs: advisers', legal and stamp costs as a share of
# everything bought (purchase, GB interconnector halves, wires).
transaction_cost_share:
  two_pct: 0.02
# Lever legacy_asset_lives: extended = extra_years more for these carriers (life extension
# without repowering), and Sizewell B to EDF's 2055.
extended_asset_lives:
  extra_years: 5
  carriers: [wind_onshore, wind_offshore, solar_pv, marine]
  retirement_year_overrides:
    Sizewell B: 2055
# Report-only sensitivity (scripts/public_ownership/repowering_sensitivity.py): the purchase
# price's change at the tariff's annuity with `share` of `carrier` repowered.  Off: the
# central valuation has no private life extension, so there is no repowering share to move.
# Kept outside valuation, which accepts only legacy_valuation.DEFAULT_SETTINGS.
repowering_sensitivity:
  enabled: false
  carrier: wind_onshore
  share: 0.5
# The legacy fleet's cash flows valued per register row as a declining profile, at the public
# real rate (what the flows are worth to the state) and at the owners' rate (what the owners
# would sell for).  Flows are held flat at their model-year level until their own expiry: RO
# accreditation runs ro_accreditation_years from the Ofgem effective date and the scheme
# closes ro_closure_date; a legacy CfD runs its round's term from its start; plant retires at
# commissioning plus its carrier life, undated rows at their carrier's median dated
# commissioning year.  Only the values listed in legacy_valuation.DEFAULT_SETTINGS are
# accepted.  Built by
#   snakemake resources/public_ownership/cp30_2030_cp30_network_legacy_valuation_summary.json
valuation:
  # 2070 before), and every stream
  # (output, wholesale, balancing, fuel and carbon, Capacity Market) on the solved years' path per MW by
  # technology (anchor_streams all; "price" moved the wholesale price only). legacy_valuation.py.
  horizon_year: life
  anchor_streams: all
  ro_register: data/market/ofgem_renewables_obligation/accredited_stations_ro_current.csv
  ro_closure_date: "2037-03-31"
  ro_accreditation_years: 20
  # Vintaged (2050) registers only: a CfD ends this many years after its round's award.  A
  # 2030 register dates each CfD from its start for its round's term.  Starts are the LCCC
  # first settlement (or expected start) date per contract phase in cfd_contract_starts
  # (built from data/market/lccc/actual_cfd_generation_and_payments.csv,
  # cfd_contract_portfolio_status.csv and cfd_pypsa_mapping_overrides.csv), else the middle
  # of the commissioning year, else the award year plus cfd_start_years_after_award_undated;
  # a phase covers its contracted MW only (Seagreen: 454 of 1,075 MW).  Terms: 15 years for
  # FIDeR and AR1-AR6, 20 from AR7 (DESNZ AR7 final response, July 2025), Hinkley Point C 35,
  # Drax's bridge 4.
  cfd_contract_years_from_award: 18
  cfd_contract_end_year_overrides:
    HPC: 2065
    # Drax bridging CfD: April 2027 to March 2031 (DESNZ/Drax, 5 Nov 2025;
    # data/market/CP30/biomass_station_schedule_2030.csv), not award + 18 (2043).
    DRAX_BRIDGE: 2031.25
  cfd_contract_starts: data/public_ownership/financing/legacy_cfd_contract_starts.csv
  cfd_contract_term_years_by_round:
    Investment Contract: 15
    MGT_IC: 15
    AR1: 15
    AR2: 15
    AR3: 15
    AR4: 15
    AR5: 15
    AR6: 15
    DRAX_BRIDGE: 4
    HPC: 35
    POWER_BECCS: 15  # dual CfD, both legs
  cfd_contract_term_years_default: 20
  dpa_contract_term_years: 15                       # Net Zero Teesside's DPA, from commissioning                # AR7 on (and the unassigned future rounds)
  cfd_start_years_after_award_undated: 3            # an undated row ends at award + 3 + 15 = award + 18
  # Contracts audit: a round's first delivery year floors a commissioning-dated start (AR8: April 2029).
  cfd_first_delivery_year_by_round:
    AR8_modelled: 2029.25
  # Continuity audit: a gas station runs at least to the end of its last Capacity Market agreement.
  cm_agreement_floor:
    file: data/market/CP30/gas_station_schedule_2030.csv
    carriers: [CCGT, OCGT, gas_engine]
  # Continuity audit: the 2030 register's batteries (all on one date) take the fleet's build profile (FES
  # 2025 HT additions 2025-30; the pre-2025 stock on REPD's operational years), not one year; a later year's register
  # keeps its cohorts' own build years.
  commissioning_profile_by_carrier:
    Battery: data/public_ownership/financing/battery_build_profile_2030.csv
  # Hinkley Point C: CP30's 2,317 MW in 2030 is unit 1 (1,630 MW net) plus unit 2 prorated
  # from its 31 July 2030 TEC date (data/market/CP30/nuclear_station_schedule_2030.csv);
  # both units (2 x 1,630 MW) run from 2031.
  capacity_from_year:
    Hinkley Point C: {from_year: 2031, capacity_mw: 3260.0}
  # Sizewell B: "20-year Contract for Difference at GBP 70.50 per megawatt hour in 2025
  # sizewell-b-power-plant-given-lifetime-extension-to-2055).  Paid as strike x output less
  # its wholesale revenue; 2025 to 2024 money at the bill's CPIH rebasing (132.9 / 138.0).
  new_contracts:
    Sizewell B: {from_year: 2035, term_years: 20, strike_gbp_per_mwh: 70.50,
                 rebasing_to_model_price_year: 0.9630434782608696}
  # Drax: its contract years valued at its own margin, not the model's.  Drax's published
  # guidance for the bridging CfD: "Targeting average Adj. EBITDA of GBP 100-200 million pa
  # from DPS over agreement period" (April 2027 to March 2031, all four 645 MW biomass units,
  # gain share included; Drax Group plc RNS "Low-carbon dispatchable CfD agreement",
  # 10 Feb 2025; strike at signing GBP 109.90/MWh in 2012 money).  The midpoint, GBP 150 m for
  # 2,580 MW, scaled to the modelled capacity and to 2024 money (taken as 2025 money).  Drax
  # closes when the contract ends (close_at_end): no merchant months after March 2031.
  declared_margins:
    Drax Power Station (biomass units): {segment_ebitda_gbp: 150.0e+6, segment_capacity_mw: 2580.0,
                                         through_year: 2031.25,
                                         rebasing_to_model_price_year: 0.9630434782608696,
                                         close_at_end: true}
  # Energy from waste is paid to take the waste it burns: WRAP Gate Fees Report 2024/25
  # median GBP 121/t (file), times the tonnes each MWh burns at plant_efficiency (0.25, the
  # marginal-cost breakdown's efficiency_used) and the fuel's 9.62 MJ/kg (Tolvik 2024):
  # 3.6 / (9.62 x 0.25) = 1.50 t/MWh, GBP 181/MWh.  Tonnes are capped at the UK's actual EfW
  # throughput, 16.82 Mt in 2024 (Tolvik Consulting, UK Energy from Waste Statistics 2024,
  # section 3), so every EfW row's tonnes scale by 16.82 / (model tonnes).  The same capped
  # income is credited in the P3 tariff (nationalised_efw_gate_fee_income).  No separate
  # waste-handling cost is added: the register's EfW running costs (technology_costs.csv,
  # BEIS Electricity Generation Costs 2020: fixed O&M GBP 179/kW-yr, VOM GBP 32.9/MWh, 2024
  # money) are BEIS's whole-plant opex, with gate fees the revenue against it (BEIS/NNFCC,
  # Review of BEIS assumptions for ACT and EfW with CHP, Dec 2020, pp. 9, 17-18); the VOM,
  # about GBP 22 per tonne of input, covers reagents and residue disposal (a declared
  # judgement).
  gate_fee_income: {carrier: waste_to_energy, file: data/public_ownership/financing/efw_gate_fees_2050.json,
                    case: central, plant_efficiency: 0.25, max_tonnes_per_year: 16.82e+6}
  # Owners' value: financing workbook v2.0's Approach 2 on each row
  # (scripts/public_ownership/legacy_valuation.py): after-tax flows (25%), plus the capital
  # allowances still to come on the row's book value (18% reducing balance; book value is the
  # workbook's historic capex by cohort, Legacy A1, written down over its accounting life, or
  # the register's as-new capex where the workbook has no cohort), end-of-year discounting at
  # the workbook's post-tax operating rate (Legacy Fleet column AF: offshore 6.1%, calibrated
  # to Brookfield's Dec 2024 purchase of 12.45% of Hornsea 1/2, Walney Extension and Burbo
  # Bank Extension, GBP 4.0 m/MW; the rest by the CEPA hurdle spread: onshore 4.78%, solar
  # 4.52%, nuclear 4.87%, thermal and storage 6.05%), as published.  Hinkley Point C, which
  # the workbook does not value, takes the new-build nuclear post-tax rate, 6.30%
  # (owner_rate_named).  owner_rate_technology_by_carrier maps carriers to workbook rows.
  owner_value_method: workbook_post_tax
  owner_rate_named:
    Hinkley Point C: Large-scale nuclear
  owner_rate_technology_by_carrier:
    pumped_hydro: Pumped hydro energy storage (PHES)
    CHP: Gas generation - unabated
    oil: Gas generation - unabated
    biogas: Anaerobic digestion (AD)
  # The owner's option: a plant closes from the first year after the model year in which its
  # total flow is negative (it is then not a liability that runs on).
  close_when_cash_negative: true
  # Gas balancing income after the model year follows NESO's constraint-cost forecast.  Gas
  # plant (CCGT, OCGT, gas engines: NESO's 'Unabated Gas') keep in year t their 2030
  # balancing margin (settlement less the variable cost of the energy redispatched) x
  # NESO_t / NESO_2030; renewables, biomass and storage stay flat.  Source: NESO, 2025 Annual
  # Balancing Costs Report (June 2025), Figure 30, thermal constraints, FES 2024 Holistic
  # Transition (file, read from the figure's vector paths).  The ratio is to the same
  # network's 2030: the expected network (CENTRAL, no_acceleration, GBP 7.22 bn in 2030) by
  # default, the recommended network for network_case cp30 (GBP 3.28 bn); after 2030 NESO's
  # two networks are identical.  NESO's projection ends in 2035, so later years hold the 2035
  # ratio (0.383 expected, 0.843 recommended).  method: neso_constraint_cost | flat (hold the
  # 2030 margin for life).
  balancing_income_path:
    method: neso_constraint_cost
    carriers: [CCGT, OCGT, gas_engine]
    file: data/public_ownership/financing/neso_constraint_cost_path.csv
    series: ht_expected_network
    series_by_network_case:
      cp30: ht_recommended_network
  # Lives (years) of the legacy fleet: the DESNZ lives the register recovers new build over
  # (technology_costs.csv: solar 38, offshore 30), except onshore wind at 25 (FES E.02 design
  # life).  The same rule as the 2050 study.  The extended_asset_lives lever is a sensitivity
  # on top.
  retirement_life_years_by_carrier:
    wind_onshore: 25
    wind_offshore: 30
    solar_pv: 38
    large_hydro: 60
    marine: 25
    biomass: 25
    # Continuity audit: GHD for DESNZ 2025 (unabated gas generation costs, nominal life 25, range
    # 20-35) and FES 2025 E.02 (25), the life the FES 2040/2050 fleet retires CCGTs on; a Capacity Market agreement
    # keeps a station to its end (cm_agreement_floor below).
    CCGT: 25
    OCGT: 25
    gas_engine: 25
    waste_to_energy: 35
    oil: 25
    CHP: 25
    Battery: 15
    nuclear: 60
    CCS Biomass: 25  # the register's recovery life
    CCS Gas: 25
  # No private life extension: plant runs to its economic life and its site is then rebuilt
  # as new build, so the purchase values it to that life.  A life-extension rule belongs to a
  # register bound's fleet_vintages.repowering (applied by
  # legacy_valuation.group_repowering_settings).
  retirement_year_overrides:
    Hinkley Point C: 2065
    # the fleet the 2040/2050 years model), so the purchase pays for no plant the later years have closed. EDF's
    # lifetime extension to 2055 is in the extended-lives sensitivity
    # (extended_asset_lives.retirement_year_overrides below); adopting it centrally needs the FES fleet to keep it.
    Sizewell B: 2036
  undated_commissioning_method: carrier_median_dated
  undated_remaining_years_by_carrier:               # undated rows with no dated peer in their carrier
    large_hydro: 30
    CCGT: 15
    waste_to_energy: 15
    # Dinorwig, Cruachan, Ffestiniog and Foyers: refurbished civil assets that FES keeps past
    # 2050; 40 runs them to the valuation horizon (2070), as in the 2050 study.
    pumped_hydro: 40
    # Drax BECCS: units converted for capture around 2030, recovered over 25 years in the register.
    CCS Biomass: 25
  undated_remaining_years_default: 10
  # The headline (valued) group.  Thermal, storage and foreign plant are profiled and priced
  # in their own groups but never enter the headline.
  valued_carriers: [wind_onshore, wind_offshore, solar_pv, large_hydro, marine, nuclear]
  # and P3 buys them at owners' value, their contracts honoured.
  thermal_carriers: [CCGT, OCGT, gas_engine, biomass, waste_to_energy, oil, CHP, coal, CCS Biomass, CCS Gas]
  excluded_carriers: [EU_market, EU_import, load_shedding]
  # pumped-storage projects without a final investment decision, model carrier LAES): never bought, so private in
  # every case and paid as today; the 2030 dispatch still runs them, as CP30 does.
  not_operating_at_acquisition:
    file: data/public_ownership/financing/not_operating_at_acquisition.csv
  # The anchored price path: each
  # technology's capture price on a straight line through today and every solved year, flat after the last
  # (scripts/public_ownership/price_anchors.py, rule build_public_ownership_price_anchors).
  price_anchors:
    # Solved years beyond the defaults (2030: the report group; 2050: fes_ht_2050), e.g. {2040: fes_ht_2040}.
    solved_groups: {2040: fes_ht_2040}
    # Carriers on the path; others keep the model year's price (a carrier whose role changes, e.g. biomass as a
    # 2050 peaker at GBP 192/MWh, would carry a ratio no existing plant earns).
    carriers: [wind_onshore, wind_offshore, solar_pv, large_hydro, marine, nuclear, waste_to_energy]
    today:
      year: 2026
      # Ofgem default tariff cap direct-fuel electricity index (Annex 2, before supplier uplifts and losses):
      # Jul-Sep 2026 91.75 (data/market/ofgem_price_cap/2026_Q3/metadata.json) and Oct-Dec 2026 about 99 (cap
      # 17a); the mean, GBP/MWh nominal. Household-shaped, so a little above a flat baseload price. PROVISIONAL.
      level_gbp_per_mwh_nominal: 95.4
      # 2026 to 2024 prices: 0.967 for 2025 to 2024 (workbook v6.2 Legacy Fleet) over about 2.5% CPI in 2026.
      deflator_to_2024: 0.943
      # The earliest solved year's time-weighted Stage 1 price, computed from these files (the reference today's
      # level is set against;
      reference_price_files: resources/market/CP30_FFR_2030_{month}_stage1_wholesale_price.csv
  reference_owner_rates: [0.067, 0.083]           # fixed bookend owner rates, for comparison with per-row WACC
