cp30_2030_no_acceleration_public_bids_p3: &po_group_no_acceleration_p3
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_no_acceleration_p3_bids
  baseline_run_group: historical_2024
  network_case: no_acceleration
  forecast_case: CP30_2030_no_acceleration_public_bids_p3
  balancing_bids: state_at_cost
  bid_case: public_ownership@fully_nationalised_market_value
cp30_2030_no_acceleration_cp32:
  <<: *po_group_no_acceleration
  price_level_of: cp30_2030_no_acceleration
  forecast_case: CP30_2030_no_acceleration_cp32
  case_selection: *headline_cases
cp30_2030_no_acceleration_public_bids_p2_cp32:
  <<: *po_group_no_acceleration_p2
  price_level_of: cp30_2030_no_acceleration_public_bids_p2
  forecast_case: CP30_2030_no_acceleration_public_bids_p2_cp32
  case_selection: *headline_cases
cp30_2030_no_acceleration_public_bids_p3_cp32:
  <<: *po_group_no_acceleration_p3
  price_level_of: cp30_2030_no_acceleration_public_bids_p3
  forecast_case: CP30_2030_no_acceleration_public_bids_p3_cp32
  case_selection: *headline_cases
# Institution twins (*_cd, institution_of): private, P1, P2 and their named cases and presets
# re-projected on the network's central-dispatch year (I3, FTI's settlement), with their own
# asset settlement (rule build_public_ownership_institution_twin_settlement), register,
# account, bills, Exchequer ledger and party flows, and no re-solve (cost-based dispatch does
# not depend on who owns the plant).  A twin repeats its parent on every key but
# forecast_case and case_selection: scenarios, named cases and presets with their private
# comparators, no grids or bounds.  It keeps market-bill cases on the contract-value stack
# only, so P3 (its own I3 path) and P2's state bids drop out.  Each case's I3 bill is set
# against private under market dispatch by merge_public_ownership_institution_groups
# ({market group}_consumer_bill_by_institution): institution given owner plus owner given
# institution, never an ownership saving added to a central-dispatch one.
cp30_2030_no_acceleration_cd:
  <<: *po_group_no_acceleration
  institution_of: cp30_2030_no_acceleration
  forecast_case: CP30_2030_no_acceleration_cd
  case_selection:
    kinds: [scenario, named, preset]
cp30_2030_cp30_network_cd:
  <<: *po_group_cp30_2030
  institution_of: cp30_2030_cp30_network
  forecast_case: CP30_2030_cp30_network_cd
  case_selection:
    kinds: [scenario, named, preset]
