historical_2020:
  model_year: 2020
  mode: twelve_months
  scenario_pattern: ConsumerBill_{month}2020_Fast
historical_2024:
  model_year: 2024
  mode: full_year
  scenario: Historical_2024_ETYS_14zone_market
# LOWER network: CP30's recommended network (network_case cp30).  Its scenario_pattern must
# equal CP30_2030_cp30_network's source_scenario_pattern.  This family (the market group, its
# P2 and P3 bid stacks and their cp32 twins) carries the headline cases only, holds the
# CENTRAL network's purchase price (purchase_price_from) and has its own institution
# comparison (its central-dispatch year).  The bid months of all three networks bid on this
# group's state-share and commissioning-year tables, so its verify stamp is the one every
# network's bid merges read.
cp30_2030_cp30_network: &po_group_cp30_2030
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_cp30_network
  baseline_run_group: historical_2024
  network_case: cp30
  purchase_price_from: cp30_2030_no_acceleration
  # The headline cases: every scenario's central case, P2 with state bids at cost, the named
  # cases, the presets and the best/worst bounds, plus each kept case's private comparator
  # (case_selection.comparators, default true).
  case_selection: &headline_cases
    kinds: [scenario, named, preset, bound]
    cases: [public_ownership@state_bids_at_cost]
  institution_comparison:
    central_scenario_pattern: CP30_FFR_2030_{month}_cp30_network_central_dispatch
    fti_settlement: resources/market/CP30_FFR_2030_year_cp30_network_central_dispatch_fti_settlement_copperplate.csv
# The same year under central dispatch at resource cost (institution I3, the nationalised
# operator).  Joins `all` only once its twelve months are in run_scenarios; the nationalised
# tariff is built on it beside the market-year group, so ownership and institution are
# never one number.
cp30_2030_cp30_network_nationalised_dispatch:
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_cp30_network_nationalised_dispatch
  baseline_run_group: historical_2024
# P2 bid stack: the same year with P2's state-owned share of each CfD unit bidding at cost
# in the balancing mechanism (Stage 1 shared through wholesale_from).  Its bill is projected
# through its own forecast case for private and the cases on its bid stack only; private here
# reproduces CP30_2030_cp30_network_public_bids_p2, so the bid stack's effect is this
# group's private less the market group's.
cp30_2030_cp30_network_public_bids_p2: &po_group_public_bids_p2
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_cp30_network_p2_bids
  baseline_run_group: historical_2024
  forecast_case: CP30_2030_cp30_network_public_bids_p2
  balancing_bids: state_at_cost
  network_case: cp30
  case_selection: *headline_cases
# P3 bid stack: every CfD unit state-owned and bidding at cost, curtailment ordered by a
# last-in-first-out tie-break.  P3 buys the legacy fleet, so its bill is the acquisition
# tariff: bid_case names the tariff case the months bid on (the case_id in the months'
# public_ownership_bids block).  The group projects `private` on the market bill and tariffs
# bid_case with every tariff case owning the same fleet (reference_runs.
# same_fleet_tariff_cases: the fully_nationalised family, which differs only in purchase
# price basis, thermal basis and annuity term).  Each case's stack effect is its tariff here
# less its tariff on the market group (merge_public_ownership_tariff_balancing_groups), with
# the purchase price held at the market year.  P3's headline is central dispatch, so this
# re-prices the market-dispatch alternative only.
cp30_2030_cp30_network_public_bids_p3: &po_group_public_bids_p3
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_cp30_network_p3_bids
  baseline_run_group: historical_2024
  forecast_case: CP30_2030_cp30_network_public_bids_p3
  balancing_bids: state_at_cost
  bid_case: public_ownership@fully_nationalised_market_value
  network_case: cp30
  case_selection: *headline_cases
# Price-level twins (*_cp32): a group re-settled at CP30's own 2030 price level (CP.32), with
# no re-solve.  A twin (price_level_of) repeats its parent on every key and projects through
# the parent's forecast case at that level.  The asset settlement is the parent's re-settled
# on the mapped hours (Stage 1 positions and CfD top-ups move; balancing settlement, fuel,
# ROCs, the DPA and every volume are held as solved); every later stage runs as for the
# parent under the twin's name.  State shares, commissioning years, their check and the bid
# decomposition are the parent's.  The P2/P3 twins are measured against the market group's
# twin; there is no institution comparison at cp32.  Headline cases only.
# scripts/public_ownership/reference_runs.py (_validate_price_level_twins) enforces this.
cp30_2030_cp30_network_cp32:
  <<: *po_group_cp30_2030
  price_level_of: cp30_2030_cp30_network
  forecast_case: CP30_2030_cp30_network_cp32
  case_selection: *headline_cases
cp30_2030_cp30_network_public_bids_p2_cp32:
  <<: *po_group_public_bids_p2
  price_level_of: cp30_2030_cp30_network_public_bids_p2
  forecast_case: CP30_2030_cp30_network_public_bids_p2_cp32
  case_selection: *headline_cases
cp30_2030_cp30_network_public_bids_p3_cp32:
  <<: *po_group_public_bids_p3
  price_level_of: cp30_2030_cp30_network_public_bids_p3
  forecast_case: CP30_2030_cp30_network_public_bids_p3_cp32
  case_selection: *headline_cases
# CENTRAL network: no_acceleration, NESO's expected network (balancing cost GBP 7.79 bn):
# Norwich to Tilbury (AENC/ATNC) and Sea Link (SCD1) not built by 2030.  Its market group
# carries every case at model price, and the P3 purchase price (purchase_price_from on the
# other networks) and the auction calibration (cost_calibration.derived_from_group) come from
# it.  Its bid months bid on cp30_2030_cp30_network's share tables; every market and bid
# month takes the stage1 family's Stage 1.
cp30_2030_no_acceleration: &po_group_no_acceleration
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_no_acceleration
  baseline_run_group: historical_2024
  network_case: no_acceleration
  forecast_case: CP30_2030_no_acceleration
  institution_comparison:
    central_scenario_pattern: CP30_FFR_2030_{month}_no_acceleration_central_dispatch
    fti_settlement: resources/market/CP30_FFR_2030_year_no_acceleration_central_dispatch_fti_settlement_copperplate.csv
# Register bound (register_bound_of): the CENTRAL market group with the legislation year at
# 2025 ("in force since 2025") instead of 2028, its own register on the same solved months,
# for the headline cases.  Its P2 and P3 state bids are not re-solved: a contract-value view.
cp30_2030_no_acceleration_legislated_2025:
  <<: *po_group_no_acceleration
  register_bound_of: cp30_2030_no_acceleration
  legislated_year: 2025
  case_selection: *headline_cases
cp30_2030_no_acceleration_public_bids_p2: &po_group_no_acceleration_p2
  model_year: 2030
  mode: twelve_months
  scenario_pattern: CP30_FFR_2030_{month}_no_acceleration_p2_bids
  baseline_run_group: historical_2024
