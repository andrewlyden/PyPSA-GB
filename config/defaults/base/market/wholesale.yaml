#  Stage 1: Wholesale Market
# Dispatch mode:
#   "single"              - Solve entire period in one LP (code default)
#   "rolling_day_ahead"   - Solve in rolling windows (day-ahead market)
#     Each window is optimised independently; storage SoC carries between
#     windows when carry_soc is true. Generators and storage see only
#     window_hours (plus any look-ahead) ahead.
mode: "rolling_day_ahead"
window_hours: 24                      # Hours per window (rolling_day_ahead mode)
carry_soc: true                       # Carry storage SoC between windows
# temporal_resolution_hours: Stage 1 solves on blocks of this many hours (block-mean inputs,
# snapshot weightings = block hours, ramp limits x hours capped at 1); outputs are written hourly,
# power held within each block and storage / store levels linear inside it, so the BM runs hourly
# on the held block positions. 1 = hourly; 3 matches NESO's simplified 3-hour PLEXOS market run
# (CP30 Annex 4, CP.28-30). Rolling windows and look-ahead must be whole blocks; not compatible
# with Stage 1 unit commitment. scripts/market/temporal_resolution.py.
temporal_resolution_hours: 1

# Scarcity pricing: a stepped reserve shortage curve in the Stage 1 LP. Margin = spare GB
# generator capacity + storage deliverable for an hour + spare import capacity; below the
# curve's thresholds the LP buys shortfall at rising prices, which lift the energy price.
# Calibrated on the 2024 gap between N2EX day-ahead prices and the model against NESO's de-rated
# margin (scripts/market/calibrate_scarcity_curve.py), with the BSC Reserve Scarcity Price
# (LoLP x VoLL) below 1 GW. On by default; always off under market.dispatch: central.
scarcity_pricing:
  enabled: true
  curve_file: "data/market/scarcity/scarcity_curve_2024.json"
  excluded_carriers: ["load_shedding", "EU_market", "EU_import"]
  # De-rated margin cap (MW): steps whose threshold is above it are dropped, e.g. 8000 keeps
  # only the steps below 8 GW. null keeps every step.
  max_drm_threshold_mw: null

# How the single GB price is produced:
#   "collapse" - exact copperplate: the mainland synchronous sub-network (every load) is
#                collapsed onto one bus just before the solve; islands, External buses and
#                every link keep their ratings, and results are expanded back onto the full
#                network for the saved .nc. Same objective as "relax" to ~1e-6 relative and
#                much faster (scripts/market/copperplate.py).
#   "relax"    - legacy copperplate: every line/transformer keeps its place with s_nom set to
#                transmission_relaxation. Slow and ill-scaled.
#   "none"     - no copperplate: Stage 1 solves on the real network (central dispatch).
copperplate_mode: "collapse"
# Island HVDC in the copperplate. The collapse keeps every link's rating, so without this the
# day-ahead market would see island HVDC limits (e.g. Shetland's 600 MW) and curtail island wind
# in Stage 1. When true, every GB-internal link of island_hvdc_carriers with an end off the
# mainland is lifted (to what all GB islands could push through it) in "collapse" and "relax";
# the balancing stage keeps the real ratings. Not applied under copperplate_mode "none".
relax_island_hvdc: true
island_hvdc_carriers: ["DC"]

# Day-ahead forecast error for the scheduling stage (off by default). When enabled, Stage 1
# schedules on a forecast rather than the outturn: one national AR(1) error per technology,
# added to every unit's capacity factor after shaping by its availability (4*CF*(1-CF), so no
# error where there is no resource and the forecast stays unbiased). The number per technology
# is the standard deviation before shaping (share of capacity); the realised national RMSE is
# lower by the RMS of the shape (about 0.8 for wind, 0.55 for solar) and is logged.
# autocorrelation_hours: AR(1) time constant; demand_rmse: demand error as a share of demand.
# Stage 2 always sees the outturn, so its redispatch against the Stage 1 schedule is the cost
# of resolving the error, which the FTI/NESO scheduling and dispatch assessment (Feb 2026)
# identifies as the main consumer cost of central dispatch. The series is generated for the
# whole calendar year from the seed and sliced to the solve period, so a week and the month
# containing it see identical forecasts. Calibration: the NESO day-ahead wind forecast has a
# capacity-weighted MAE of about 4.2% (Significance, 2024), roughly 5.3% RMSE; the defaults
# realise about 5.5% for wind and 5% for solar. scripts/market/forecast_error.py.
forecast_error:
  enabled: false
  seed: 2030
  autocorrelation_hours: 6.0
  technologies:
    wind_offshore: 0.07
    wind_onshore: 0.07
    solar_pv: 0.09
  demand_rmse: 0.015
# s_nom value (MVA) applied to ALL lines and transformers in "relax" mode.
# Must be >> max line flow.
transmission_relaxation: 1.0e6
# Minimum storage dispatch cost (GBP/MWh discharged) enforced before the
# wholesale solve. Breaks the zero-price charge/discharge degeneracy that a
# barrier solve without crossover otherwise exploits (see solve.solver.crossover).
# Units already carrying a higher marginal_cost are left alone; 0 disables.
storage_marginal_cost_floor: 1.0
# Stage 1 calibration blocks, off by default; their other keys default in code.
# interconnector_hurdle_override (scripts/market/interconnector_hurdle.py,
# DEFAULT_HURDLE_OVERRIDE): when enabled, Stage 1 re-prices the single-basis interconnector
# links before the solve as if built with spread_gbp_per_mwh [0.0] and
# export_bid_floor_gbp_per_mwh [null = no floor] in place of interconnectors.pricing
# single_price_transaction_spread / single_price_export_bid_floor (GBP/MWh). The IC1 volume
# tranches, the cable loss and the circulation epsilon are kept. level_offset_gbp_per_mwh [0.0]
# adds a constant to every foreign reference price; apply_in_balancing [false] re-prices the
# balancing stage's network the same way, so the BM values IC moves on Stage 1's foreign prices.
# churn_sink (market_utils._churn_sink_frame): a negative-only generator at each storage bus,
# share_of_storage_power (share 0-1) x that bus's storage power, priced just above the AR4+
# curtailment bid, that absorbs surplus where the market would otherwise curtail; the
# balancing stage holds it at its Stage 1 output.
# central_constraint_screening (scripts/market/central_constraint_screening.py,
# DEFAULT_CONFIG): a central-dispatch Stage 1 solves each window with thermal limits on a
# monitored subset of branches and adds violated branches until none is exceeded; same optimum.
# Related: market.hydrogen_offtake_scale [absent = the build's offtake] scales the GB_H2 offtake
# load in both stages (market_utils.apply_hydrogen_offtake_scale).
interconnector_hurdle_override:
  enabled: false
churn_sink:
  enabled: false
central_constraint_screening:
  enabled: false
# Marginal cost basis for Stage 1 (as_built | resource_cost). as_built: Stage 1 schedules on
# the network's market-shaped costs (ROC plant at -(banding x buyout), CfD plant at zero),
# which is what the plant bids. resource_cost: a public operator dispatching on fuel, carbon
# and variable O&M alone; renewables go to renewable_floor (GBP/MWh) and, using the build-time
# cost audit, any other generator whose cost carries a subsidy layer goes to fuel + carbon +
# VOM. Nuclear, thermal formula costs, storage and load shedding are untouched.
# scripts/market/marginal_cost_basis.py.
marginal_cost_basis:
  mode: as_built
  renewable_floor: 0.01
  # Under resource_cost, renewables at the floor are ordered by the support they lose when
  # turned down (merchant first, the highest CfD strike or ROC value last), spread over
  # spread_gbp_per_mwh (Ofgem 2023, A1.18). Code default DEFAULT_SUPPORT_ORDER.
  support_order:
    enabled: true
    spread_gbp_per_mwh: 1.0
# The order in which zero-cost renewables give way when supply exceeds demand
# (as_built | contract_aware). as_built: every CfD and merchant unit at 0, a tie the barrier
# solver splits arbitrarily. contract_aware: each unit backs off where its support terms make
# it: merchant renewables (merchant_carriers) at their cost plus
# merchant_variable_cost_gbp_per_mwh, so they are curtailed first; AR4+ CfDs at
# ar4_plus_bid_gbp_per_mwh (0: the contract pays whenever the price is not negative, so 0 is
# the reservation price); AR1-AR3, Investment Contracts and HPC at minus strike, so only they
# and ROC plant take the price below zero. Market wholesale only: not applied under
# copperplate_mode none (central dispatch) or marginal_cost_basis resource_cost.
# scripts/market/curtailment_order.py.
renewable_curtailment_order:
  mode: as_built
  ar4_plus_bid_gbp_per_mwh: 0.0
  merchant_variable_cost_gbp_per_mwh: 0.5
  merchant_carriers: [wind_offshore, wind_onshore, solar_pv, marine, large_hydro, small_hydro]

# Optional Stage 1 unit commitment overlay, independent of solve.mode, so the wholesale
# schedule can be MILP while the BM remains an anchored LP. Disabled by default (slower).
# Further keys, not set here (code defaults in brackets; scripts/market/wholesale_commitment.py):
#   method [milp]: milp = one MILP per window, no marginal prices; milp_fixed = MILP
#     commitment, then the LP with that commitment held as output bounds
#     (status x floor <= p <= status x available), whose duals are the prices (restricted
#     pricing); linearized = PyPSA's linearised relaxation (Hua et al. 2017), one LP.
#   carrier_parameters.<carrier>.module_mw [null]: a committed unit's floor is
#     p_min_pu x min(1, module_mw / p_nom) x p_max_pu(t) and a start costs
#     start_up_cost_per_mw x min(module_mw, p_nom) (stations committed one module at a time).
#   milp_options [{MIPGap: 0.005, TimeLimit: 600}]: Gurobi options of the MILP pass.
#   initial_status also takes "free" (no initial state); milp_fixed carries each window's
#     commitment into the next and applies initial_status to the first window only.
#   Units with a positive minimum output (must-run) are never committed.
# Units: min_p_nom_mw in MW; ramp limits as a share of p_nom per hour; min up/down times in
# hours; start-up and shut-down costs in GBP/MW.
unit_commitment:
  enabled: false
  min_p_nom_mw: 50.0
  initial_status: "off"              # "off" | "on" | "preserve"
  default_ramp_limit_up: 1.0
  default_ramp_limit_down: 1.0
  default_ramp_limit_start_up: 1.0
  default_ramp_limit_shut_down: 1.0
  exclude_carriers:
    - "load_shedding"
    - "EU_import"
    - "wind_onshore"
    - "wind_offshore"
    - "solar_pv"
    - "embedded_solar"
    - "embedded_wind"
  carrier_parameters:
    CCGT:
      enabled: true
      p_min_pu: 0.35
      min_up_time: 4
      min_down_time: 3
      ramp_limit_up: 0.50
      ramp_limit_down: 0.50
      start_up_cost_per_mw: 45.0
      shut_down_cost_per_mw: 0.0
    OCGT:
      enabled: true
      p_min_pu: 0.20
      min_up_time: 1
      min_down_time: 1
      ramp_limit_up: 1.0
      ramp_limit_down: 1.0
      start_up_cost_per_mw: 20.0
      shut_down_cost_per_mw: 0.0
    gas_engine:                     # reciprocating engines: fast, flexible
      enabled: true
      p_min_pu: 0.20
      min_up_time: 1
      min_down_time: 1
      ramp_limit_up: 1.0
      ramp_limit_down: 1.0
      start_up_cost_per_mw: 10.0
      shut_down_cost_per_mw: 0.0
    coal:
      enabled: true
      p_min_pu: 0.40
      min_up_time: 8
      min_down_time: 6
      ramp_limit_up: 0.35
      ramp_limit_down: 0.35
      start_up_cost_per_mw: 80.0
      shut_down_cost_per_mw: 0.0
    oil:
      enabled: true
      p_min_pu: 0.25
      min_up_time: 2
      min_down_time: 2
      ramp_limit_up: 0.80
      ramp_limit_down: 0.80
      start_up_cost_per_mw: 30.0
      shut_down_cost_per_mw: 0.0


# Look-ahead (rolling_day_ahead only): each window is optimised over window_hours +
# look_ahead_hours (cut at the solve period's end) and only its first window_hours are kept;
# the next window starts from the state at the last kept hour. Storage then values what it
# holds at the window's end at the next day's prices instead of at nothing. 0 or null = no
# look-ahead. Rationale and cost: scripts/market/solve_wholesale.py, "Look-ahead for the
# rolling day-ahead stage".
look_ahead_hours: 24


# The look-ahead hours as blocks of this many hours (block-mean inputs, snapshot weightings
# equal to the block length); the kept hours stay at full resolution. null = hourly. 6-hour
# blocks keep about 98% of the hourly look-ahead's storage arbitrage gain at a much smaller LP.
look_ahead_resolution_hours: 6
