# Demand time-series shape:
#   "ESPENI"    - historical half-hourly GB demand (historical runs use it directly)
#   "eload"     - eLOAD model hourly profile (2010 or 2050 via profile_year)
#   "desstinee" - DESSTINEE model hourly profile (2010 or 2050 via profile_year)
# Future runs scale the shape to FES ED1 consumer demand and allocate it by Dem_BB003 GSP shares.
# For eload/desstinee, profile_year defaults to 2050 if modelled_year >= 2040, else 2010.
timeseries: "ESPENI"

# Demand disaggregation (off by default): split components out of total demand, using FES fractions
# and GSP spatial allocation for future scenarios.

disaggregation:
  enabled: false
  components:
    - name: "heat_pumps"
      allocation_method: "fes_gsp"
      use_fes_fraction: true
      min_gwh_threshold: 0.01
    - name: "electric_vehicles"
      allocation_method: "fes_gsp"
      use_fes_fraction: true
      min_gwh_threshold: 0.01

# Demand-side flexibility from heat pumps, EVs and demand response, each switched on separately.
# Heat-pump and EV flexibility need demand.disaggregation enabled with that component.

flexibility:
  # Master switch - must be true for any flexibility to be modeled
  enabled: false

  # Heat-pump flexibility (needs heat_pumps in demand.disaggregation.components)
  heat_pumps:
    enabled: false
    mode: "MIXED"                     # TANK, COSY, or MIXED (use mix shares below)
    flex_share: 0.2                   # Fraction of HP demand that is flexible
    mix:
      tank_share: 0.5                 # Fraction of flexible HP demand using TANK mode
      cosy_share: 0.5                 # Fraction of flexible HP demand using COSY mode
    # Spatial allocation
    urban_weight: 1.5                      # Power exponent for urban-weighted allocation (>1 = more urban)
    peak_thermal_kw_per_dwelling: 10.0     # Assumed peak thermal output per dwelling (kW)
    link_sizing_margin: 1.5                # Margin factor for HP link capacity (1.5 = 50% headroom)
    # COSY mode: pre-heating using building thermal mass
    cosy:
      morning_window: ["07:00", "09:00"]   # Morning pre-heat window
      evening_window: ["17:00", "19:00"]   # Evening pre-heat window
      max_temp_deviation_celsius: 2.0      # Max comfort deviation (C)
      thermal_mass_hours: 0.3              # Hours of heating that can be stored in building fabric
                                           # (~2.7 kWh per dwelling at ~10 kW peak thermal)
      standing_loss_per_hour: 0.05         # Building thermal loss rate (5%/hour, faster than tank)
    # TANK mode: hot water tank storage
    tank:
      volume_liters: 200              # Average tank volume (litres)
      temp_range: [50, 65]            # Min/max temperature (C)
      standing_loss_per_hour: 0.01    # Heat loss fraction per hour (1%)
      heater_power_kw: 3.0            # Immersion heater power (kW)

  # Electric-vehicle flexibility (needs electric_vehicles in demand.disaggregation.components).
  # FES building blocks: Dem_BB006 domestic and Dem_BB007 non-domestic EV charging demand (GWh),
  # Srg_BB005 V2G availability (MW; V2G and MIXED), Srg_BB007a smart-charging availability (MW; MIXED).
  # Without flexibility EVs are Load components with an evening-peak profile; with it, Store and Link
  # components let charging be optimised.
  electric_vehicles:
    enabled: false
    tariff: "MIXED"                     # GO, INT, V2G, or MIXED (see modes below)

    # Share of EV demand that is flexible (smart charging); the rest is fixed load.
    flex_share: 0.2

    # Fleet characteristics (affect storage/charger sizing)
    battery_capacity_kwh: 60.0        # Average EV battery size (kWh)
    charge_efficiency: 0.90           # Grid-to-battery efficiency
    flexibility_participation: 0.10   # Fraction of fleet participating in smart charging

    # Spatial allocation and fleet sizing
    urban_weight: 2.0                 # Power exponent for urban-weighted allocation (>1 = more urban)
    energy_per_vehicle_kwh_per_day: 10.0  # Assumed daily energy consumption per vehicle (kWh)
    charging_hours_per_day: 4.0       # Assumed charging hours/day (for FES share calculation)
    min_share_threshold: 0.001        # Minimum tariff share to create components

    # GO: fixed cheap overnight window (Octopus Go style). The cost difference steers charging into
    # the window; charging outside it remains possible at offpeak_cost.
    go:
      window: ["00:00", "04:00"]      # Cheap charging window (4 hours)
      window_cost: 0.0                # Marginal cost during cheap window (GBP/MWh)
      offpeak_cost: 100.0             # Marginal cost outside window (GBP/MWh)

    # INT: intelligent smart charging, shiftable across all plugged-in hours
    int:
      min_soc: 0.20                   # Minimum SOC (range anxiety buffer)
      target_departure_soc: 0.80      # Target SOC at departure time (7am)
      charger_power_kw: 7.0           # Home charger power (kW)

    # V2G: bidirectional. Capacity from FES Srg_BB005 (distributed by EV demand) if use_fes_capacity,
    # else fleet x participation_rate x charger_power.
    v2g:
      participation_rate: 0.30        # Fraction of flexible fleet with V2G (if not using FES)
      discharge_efficiency: 0.90      # Battery-to-grid efficiency
      max_discharge_soc: 0.80         # Multiplies the V2G discharge link's p_max_pu (share of plugged-in power)
      degradation_cost_per_mwh: 50.0  # Battery wear cost (GBP/MWh)
      use_fes_capacity: true          # Use FES Srg_BB005 V2G capacity

    # MIXED: the fleet split across GO, INT and V2G
    mixed:
      # "fes": shares from FES building blocks; "manual": the shares below
      mode: "fes"

      # Manual shares (mode "manual", or when FES data is unavailable); must sum to 1.0
      go_share: 0.30                  # 30% on Octopus Go style (fixed window)
      int_share: 0.50                 # 50% on intelligent smart charging
      v2g_share: 0.20                 # 20% with V2G capability

      # In "fes" mode: V2G share = Srg_BB005 (V2G MW) / total EV charging capacity, INT share the
      # remaining Srg_BB007a smart charging, GO the remainder. Option: fix a share here (e.g.
      # go_share: 0.20) and the others adjust.
      fes_share_overrides:

    # Availability profile (from GB traffic patterns): share of EVs plugged in
    availability:
      avail_max: 0.95                 # Max fraction plugged in (overnight)
      avail_mean: 0.80                # Mean fraction plugged in
      departure_hour: 7               # Morning departure time for DSM constraint

  # Domestic demand response (Saving Sessions style events): households reduce demand during events
  event_response:
    enabled: false

    # mode:
    #   "regular" - events_per_week_regular all year
    #   "winter"  - events_per_week_winter in winter_months only
    #   "both"    - events_per_week_winter in winter_months, events_per_week_regular otherwise
    mode: "both"
    events_per_week_regular: 2          # Events per week in regular/both modes
    events_per_week_winter: 5           # Events per week in winter/both modes

    # Event window [start, end]; e.g. ["17:00", "19:00"] evening peak, ["16:00", "20:00"] extended
    # evening, ["07:00", "22:00"] full day
    event_window: ["07:00", "22:00"]  # Full day

    dsr_capacity_mw: null             # Domestic DSR capacity (MW); null = participation_rate x max_reduction_fraction x demand
    participation_rate: 0.33          # Fallback: participation rate (33%)
    max_reduction_fraction: 0.10      # Fallback: max demand reduction per event (10%)
    marginal_cost: 100.0              # DSR incentive payment (GBP/MWh); high, so dispatched only when needed
    winter_months: [10, 11, 12, 1, 2, 3]  # Oct-Mar for winter mode
