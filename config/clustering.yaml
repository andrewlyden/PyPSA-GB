# Network clustering presets and aggregation strategies.
#
# A scenario sets network.clustering to a preset name, an inline config, or a preset extended with its own keys
# (config/config_loader.py resolve_clustering):
#   clustering: gsp_spatial     # a preset by name
#   clustering:                 # an inline config
#     method: kmeans
#     n_clusters: 5
#   clustering:                 # a preset extended
#     preset: gsp_spatial
#     strategies: {...}
# Component aggregation is a separate setting, network.component_aggregation.

# Presets: name one under network.clustering.

presets:

  # GSP regions (recommended for most uses). ETYS bus x/y are OSGB36 (EPSG:27700) metres.
  gsp_spatial:
    method: spatial
    boundaries_path: "data/network/GSP/GSP_regions_27700_20250109.geojson"
    cluster_column: "GSPs"
    bus_crs: "EPSG:27700"  # ETYS bus x/y are OSGB36 metres
    boundary_crs: "EPSG:27700"
    fallback: "nearest_centroid"
    convert_transformers_to_lines: true

  # Administrative regions (larger zones)
  admin_regions:
    method: spatial
    boundaries_path: "data/zone/uk_admin_regions.geojson"
    cluster_column: "region_name"
    bus_crs: "EPSG:27700"  # ETYS bus x/y are OSGB36 metres
    boundary_crs: "EPSG:27700"
    fallback: "nearest_centroid"

  # K-means on bus coordinates, 10 clusters
  kmeans_10:
    method: kmeans
    n_clusters: 10
    random_state: 42
    init_method: "k-means++"

  # K-means on bus coordinates, 5 clusters (for reduced networks)
  kmeans_5:
    method: kmeans
    n_clusters: 5
    random_state: 42
    init_method: "k-means++"

  # Hierarchical clustering, 15 clusters
  hierarchical_15:
    method: hierarchical
    n_clusters: 15
    linkage: "ward"
    distance_metric: "euclidean"

  # Explicit bus-to-cluster mapping from a CSV
  custom_busmap:
    method: busmap
    busmap_source: "data/clustering/custom_bus_mapping.csv"
    default_cluster: "unassigned"
    validate_buses: true

  # Bus map for the zonal network
  zonal_busmap:
    method: busmap
    busmap_source: "data/zone/zonal_bus_mapping.csv"

# Aggregation strategies: how component attributes combine when buses are clustered. These named sets are loaded
# as aggregation_strategies; the clustering rule applies a scenario's own network.clustering.strategies.

aggregation_strategies:

  # Default (balanced)
  default:
    bus:
      x: mean
      y: mean
    line:
      voltage_kv: max
      s_nom: sum
      length: sum
      # Line r/x/b/g are always aggregated in per unit (1 MVA base) and
      # converted back to ohm/S at the clustered line's bus0 v_nom: parallel
      # combination for r and x, sum for b and g (cluster_network.py enforces
      # this and warns if a different rule is given here).
      r: parallel_impedance
      x: parallel_impedance
    transformer:
      v_nom: max
      s_nom: sum
    generator:
      p_nom: sum
      marginal_cost: mean
      efficiency: mean
    load:
      p_nom: sum
    storage_unit:
      p_nom: sum
      max_hours: mean
      efficiency_store: mean
      efficiency_dispatch: mean
    store:
      e_nom: sum
    link:
      p_nom: sum
      efficiency: mean

  # Aggressive (maximum reduction, some accuracy lost)
  aggressive:
    bus:
      x: mean
      y: mean
    line:
      voltage_kv: max
      s_nom: sum
    generator:
      p_nom: sum
      marginal_cost: min         # the cheapest member's cost
    load:
      p_nom: sum
    storage_unit:
      p_nom: sum
      max_hours: mean
    link:
      p_nom: sum

  # Economic (keeps dispatch economics)
  economic:
    bus:
      x: mean
      y: mean
    line:
      voltage_kv: max
      s_nom: sum
      capital_cost: sum
    generator:
      p_nom: sum
      marginal_cost: mean
      capital_cost: mean
    load:
      p_nom: sum
    storage_unit:
      p_nom: sum
      marginal_cost: mean
      capital_cost: mean

# Method reference: each method's required and optional keys (documentation only).

methods:
  spatial:
    description: "Cluster buses based on geographical boundaries (e.g., GSP regions)"
    required: [boundaries_path]
    optional:
      cluster_column: "Column name containing cluster IDs"
      bus_crs: "Coordinate reference system for buses (default: EPSG:4326)"
      boundary_crs: "CRS for boundaries (default: EPSG:27700)"
      fallback: "Method for unassigned buses: nearest_centroid, nearest_neighbor, default_cluster"
      convert_transformers_to_lines: "Convert transformers to lines before clustering"

  busmap:
    description: "Explicit bus-to-cluster mapping from CSV file"
    required: [busmap_source]
    optional:
      default_cluster: "Name for buses not in mapping"
      validate_buses: "Check all network buses are in mapping"

  kmeans:
    description: "K-means clustering based on geographical coordinates"
    required: [n_clusters]
    optional:
      random_state: "Random seed for reproducibility"
      init_method: "Centroid initialization: k-means++, random"

  hierarchical:
    description: "Hierarchical clustering based on electrical/geographical distances"
    required: [n_clusters]
    optional:
      linkage: "Linkage criterion: ward, complete, average"
      distance_metric: "Distance metric: euclidean, etc."

  custom:
    description: "Custom clustering using user-defined function"
    required: [function_path, function_name]
    optional:
      custom_params: "Additional parameters passed to function"
