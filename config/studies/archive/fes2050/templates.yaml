# Templates: named building blocks, composed by `inherits: [...]` (two may not set the same leaf, D8).

archive_fes2050_base:
  modelled_year: 2050
  renewables_year: 2013
  demand_year: 2013
  network_model: ETYS
  FES_year: 2025
  FES_scenario: Holistic Transition

archive_fes2050_except_HT50_clustered_gsp_HT50_reduced_eload_2050:
