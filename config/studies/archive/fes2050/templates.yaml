      method: custom
      function_path: scripts/network_clustering/neso_zone_busmap.py
      function_name: cluster_buses
      convert_transformers_to_lines: true
      neso_zone_busmap:
        remote_km: 2.0
        cutoff: 6
      secured_capability:
        include:
          B4: [{component: link, name: DRAX41_PEHE4J_HVDC_2029, sign: -1.0}, {component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
          B5: [{component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
      strategies:
        line:
          voltage_kv: max
          v_nom: max
          s_nom: sum
          length: mean
          length_km: mean
          b: sum
          s_nom_winter: sum
          s_nom_spring: sum
          s_nom_summer: sum
          s_nom_autumn: sum
          etys_licensee: first
          etys_licensee_source: first
          etys_topology_source: first
          cp30_project_code: first
          cp30_source: first
          seasonal_rating_source: first
    transmission:
      outage_schedule:
        enabled: true
        secured_capability:
          capability_year: 2050
          fes_pathway: HT
          include:
            B4: [{component: link, name: DRAX41_PEHE4J_HVDC_2029, sign: -1.0}, {component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
            B5: [{component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
          hold_last_year: true
          boundaries: [B1a, B2, B4, B6, B7a, B8, B9, EC5, LE1, SW1, B13]
          branch_scaling:
            enabled: true
            margin: 1.25
        source: secured_capability
    reinforcements:
      components_file: data/network/ETYS/cp30_n1_accelerated_components.csv
      enabled: true
      manifest_file: data/network/ETYS/cp30_n1_reinforcement_manifest.csv
      reference_file: resources/CP30/CP30_reference_N1_N2_NA1.csv
      strict: false
  market:
    enabled: true
    wholesale:
      mode: rolling_day_ahead
    balancing:
      mode: rolling
      window_hours: 24
      participation:
        generators:
          min_p_nom_mw: 1.0
          penalty_offer_price: 6000.0
          penalty_bid_price: 6000.0
