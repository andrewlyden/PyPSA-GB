# Templates: named building blocks, composed by `inherits: [...]` (two may not set the same leaf, D8).

archive_val20_base:
  modelled_year: 2020
  renewables_year: 2020
  demand_year: 2020
  network_model: ETYS
  market:
    enabled: true
    wholesale:
      mode: rolling_day_ahead
    balancing:
      mode: rolling
      participation:
        generators:
          min_p_nom_mw: 1.0
          exclude_carriers: [load_shedding, embedded_solar, embedded_wind]
          penalty_offer_price: 6000.0
          penalty_bid_price: 6000.0
          behavior: fallback_priced
      elexon:
        price_ladders:
          enabled: true
  renewables:
    aggregation:
      enabled: true
    embedded:
      wind_overlap_exclusion:
        enabled: true
  network:
    component_aggregation:
      enabled: true
      include_storage_units: true
      include_loads: true
    transmission:
      outage_schedule:
        enabled: true
        neso:
          boundary_include: [SCOTEX, SSE-SP, 'SSHARN::SSHARN_SPARSE_GATE_FIT', ESTEX, SEIMP, SWALEX]
  support:
    labels:
      enabled: true
    dispatch_costs:
      enabled: true
  marginal_costs:
    empirical_calibration:
      enabled: true
    biofuel_subsidy:
      enabled: true
  thermal:
    availability_factors:
      enabled: true

