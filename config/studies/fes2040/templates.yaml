  storage:
    round_trip_efficiencies:
      CAES: 0.601
  public_ownership:
    # Small-scale plant that no case owns or buys: FES 2025 HT's 2040 "Distributed - Micro" supply (rooftop solar
    # 33.10 GW, micro wind 1.05 GW, micro hydro 0.20 GW), taken pro rata from each carrier's FES rows (the FES rows
    # do not separate micro from distributed plant).
    small_scale_exclusion:
      es1_lines: resources/FES/fes2025_holistic_transition_2040_es1_lines.csv
    support_lines:
      ancillary_services:
        enabled: true
        table: data/public_ownership/financing/ancillary_services_2040.csv
        case: central
      efw_gate_fee:
        enabled: true
        file: data/public_ownership/financing/efw_gate_fees_2040.json
        case: central
      life_extension_top_up:
        enabled: true
        technologies:
          Offshore wind: expired
          # Life-extended onshore wind runs merchant at operating cost, topped up only where its revenue falls short.
          Onshore wind: expired
          Biomass - unabated: all
          Biomass - with CCUS - mature: expired
      battery_top_up:
        enabled: true
        carriers: [Battery]
      battery_subhourly_uplift:
        enabled: true
        carriers: [Battery]
        case: central
        central: 0.2
        high: 0.4
    vintage_capital_2050:
      amortisation: contract_term_with_tail
      capture_prices: data/public_ownership/financing/capture_prices_2040.csv
      strike_calibration: data/public_ownership/financing/strike_calibration_2040.csv
      strike_calibration_by_rate_path:
        neso_wind_ramp: data/public_ownership/financing/strike_calibration_2040_neso_wind_ramp.csv
      legacy_expired_contracts:
        labelled: true
        technologies:
          Biomass - unabated: [2002, 2024]
          Hydropower: [2002, 2017]
      beccs_carbon_cfd_term_years: 15
      beccs_removals_after_cfd: ets_value
      legacy_sunk_capital:
        technologies: [Pumped hydro energy storage (PHES), Hydropower, Energy from waste]
      rab_outside_propositions: true
      carried_from_earlier_purchase_contracts: [HPC_UNIT_1]
      # MW of each carried contract the 2030 purchase bought, to be derived from the final 2030 register's
      # `Hinkley Point C::legacy` row. While the map is empty, every row labelled with a carried contract is
      # carried whole.
      carried_from_earlier_purchase_mw: {}
      rab_acquired_at_rav: true
      merchant_capital: level_annuity
      bm_strike_basis: calibrated
      # Share of contract revenue (0-1) post-AR7 CfD cohorts keep as rent; the installed strike calibration must
      # carry the same margin. 0 and 0.10 are the fes_ht_2040_auction_margin_{none,high}_bound groups.
      auction_margin_share: 0.05
    # Each owner of a co-owned P2 row finances its own part (separate). The co-owner's halo
    # (separate_with_private_reduction) and the pooled leakage test (pooled) are the
    # fes_ht_2040_coownership_{reduction,pooled}_bound groups.
    co_ownership_finance:
      basis: separate
    # Risk-adjusted (Lucas) columns beside the headline (off in the base defaults).
    risk_adjusted_view:
      enabled: true
    lever_parameters:
      # Wholly state-owned rows self-insure in 2040 as in 2030 and 2050.
      self_insurance_in_vintaged_registers: true
    # The Capacity Market under ownership: state_planned (central) | market_participant (today's treatment).
    # P2: the state's plant leaves the auction (the target falls by its de-rated eligible capacity) and the CM
    # buys the residual at the residual clearing price; co-owned rows leave pro rata, P1's stakes stay in.
    # P3: a targeted adequacy contract for what the state does not own, at that residual price. Today's
    # treatment is fes_ht_2040's one-at-a-time `public_ownership@cm_market_participant` and named
    # `fully_nationalised_market_value_cm_market_participant`. Fleet and summary from rule
    # build_capacity_market_2050, re-cleared per case (scripts/public_ownership/capacity_market_design.py).
    # Vintaged registers only: never combined with the 2030 CM mechanisms (state bids in the 2030/31 T-4,
    # lever capacity_procurement).
    capacity_market_design:
      central: state_planned
      fleet: resources/market/capacity_market/cm_fleet_2040.csv
      summary: resources/market/capacity_market/cm_calendar_2040_summary.json
    consumer_bill:
      ldes_cap_and_floor:
        carriers: [LAES, CAES, Pumped Storage Hydroelectricity]
        floor_return:
          rate_key: row_owner
    acquisition:
      valuation:
        retirement_life_years_by_carrier:
          solar_pv: 38
          wind_offshore: 30
          wind_onshore: 25
          large_hydro: 100
        # The valuation has no repowering rule: an owner's plant runs to its life (a toggle group values on its
        # own fleet_vintages.repowering rule).
        undated_remaining_years_by_carrier:
          large_hydro: 40
          pumped_hydro: 40
    generator_costs:
      insurance:
        excluded_technologies: [Large-scale nuclear, Lithium batteries, Novel long duration energy storage (LDES), Small modular reactors (SMRs), Floating offshore wind]
    network_account:
      model_years:
        2040:
