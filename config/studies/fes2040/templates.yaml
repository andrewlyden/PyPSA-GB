# Price calibration on ht40 (the 2050 study's method): three of the external studies' own methods, each sourced (interconnector
# hurdle, foreign prices, hydrogen price).
ht40_foreign_and_hydrogen_prices:
  inherits: ht40
  market:
    wholesale:
      # Interconnectors trade at losses and fees only (4 GBP/MWh round trip) in place of the CP30-fitted hurdle of
      # 30 GBP/MWh; the external studies model Europe as one market with no hurdle.
      interconnector_hurdle_override:
        enabled: true
        spread_gbp_per_mwh: 4.0
        export_bid_floor_gbp_per_mwh: null
        apply_in_balancing: true
    balancing:
      participation:
        storage_units:
          exclude_carriers: [EV_smart_charging, V2G_fleet, HP_flexibility, DH_flexibility, IC_DSR, residential_DSR, DACCS]
    # Foreign prices overridden on the TYNDP shape; the scenario (TYNDP 2026 draft National Trends+ 2040, in place
    # of TYNDP 2024 Distributed Energy) is set in ht40_tyndp_ntplus2026.
    foreign_price_override:
      enabled: true
      tyndp:
        route: tyndp_shape
    # Hydrogen at DESNZ's blue hydrogen cost, as LCP Delta for DESNZ (2024, p.63) and FTI for NESO (2025) price it:
    # BEIS Hydrogen Production Costs 2021, ATR + CCUS 1,000 MW on wholesale gas (Chart 6.1: 2040 equals 2050), about
    # 52 GBP/MWh H2 HHV in 2020 prices (p.27), x 1.232 (ONS CPI 2020 to 2024) = 64 GBP/MWh H2. Values by year:
    # data/FES/fes_year_parameters.csv.
    hydrogen_supply_price:
      enabled: true
      gbp_per_mwh_h2: year_parameter:hydrogen_supply_price_gbp_per_mwh_h2
      link: GB_gas_reforming_ccs
      source: BEIS Hydrogen Production Costs 2021, ATR + CCUS 2040 (equal to 2050, Chart 6.1) on wholesale gas, about 52 GBP/MWh H2 HHV (2020 prices) x 1.232 CPI to 2024 = 64; the DESNZ blue hydrogen price LCP Delta for DESNZ (2024, p.63) uses

# Foreign prices from the TYNDP 2026 draft National Trends+ 2040 scenario; the shared build FES25_HT_2040 and every
# month family inherit it.
ht40_tyndp_ntplus2026:
  inherits: ht40_foreign_and_hydrogen_prices
  market:
    foreign_price_override:
      tyndp:
        scenario: NTplus2026

# Solve only the scenario's solve_period (one month).
ht40_period_on:
  inherits: ht40_tyndp_ntplus2026
  solve_period:
    enabled: true

# P2 bid stacks: the state's plant bids at cost in the balancing mechanism; each family names its
# shares file and case.
ht40_bids_p2:
  inherits: ht40_period_on
  support:
    bm_bids:
      contract_value_bids:
        public_ownership_bids:
          enabled: true
          public_bid_price: 0.0
          state_first_step_gbp_per_mwh: 1.0

# The balancing mechanism bounds the hydrogen store by its own level only, not a Stage 1 band.
ht40_gate_week:
  inherits: ht40_tyndp_ntplus2026
  market:
    balancing:
      hydrogen_links:
        store_band: none

# Hydrogen store trajectory read from an alternative annual-pass file.
ht40_reserve4_trajectory:
  inherits: ht40_period_on
  market:
    hydrogen_store:
      seasonal_trajectory:
        file: resources/market/FES25_HT_2040_seasonal_trajectory_reserve4.csv

# Scarcity pricing in Stage 1.
ht40_scarcity_pricing:
  inherits: ht40_period_on
  market:
    wholesale:
      scarcity_pricing:
        enabled: true

# The hydrogen store's period end is valued, with no end condition.
ht40_gate_week_end_value:
  inherits: ht40_tyndp_ntplus2026
  market:
    hydrogen_store:
      seasonal_trajectory:
        end_condition: value

# Solve on the shared FES25_HT_2040 network instead of building one.
ht40_on_parent_build:
  network_from: FES25_HT_2040

# Months follow the annual pass: carried hydrogen stores start on its trajectory and each Stage 1
# window's end level is valued at the annual dual.
ht40_h2_annual_pass:
  market:
    hydrogen_store:
      seasonal_trajectory:
        enabled: true
        end_value: dual

# Storage units also start on the annual pass's state of charge, with their period end valued at its dual.
ht40_h2_pass_with_storage_units:
  market:
    hydrogen_store:
      seasonal_trajectory:
        storage_units: true
    storage_soc:
      month_end: free

# A window ending below the trajectory pays a shortfall premium (GBP/MWh H2) over the end value.
ht40_h2_pass_soft_floor:
  market:
    hydrogen_store:
      seasonal_trajectory:
        end_condition: soft_floor
        shortfall_penalty_gbp_per_mwh_h2: 8.0
        soft_floor_windows: every_window

# Trajectory file: the market year's annual pass.
ht40_h2_pass_trajectory:
  market:
    hydrogen_store:
      seasonal_trajectory:
        file: resources/market/FES25_HT_2040_seasonal_trajectory.csv

# Balancing-mechanism bids: contract-value bids for supported plant, merchant renewables at 20 GBP/MWh,
# support labels from the fes_ht_2040 register group.
ht40_bm_bids:
  market:
    balancing:
      # NESO 2025): unabated gas at 1.6 x SRMC, storage offer
      # floors, renewables do not offer up, hydro at 110 / -15.
      carrier_overrides:
        Battery:
          offer_floor: 69.0
        CAES:
          offer_floor: 106.0
        CCGT:
          offer_markup: 0.6
          mode: markup
        CHP:
          offer_markup: 0.6
        Domestic Battery:
          offer_floor: 69.0
        LAES:
          offer_floor: 106.0
        OCGT:
          offer_markup: 0.6
        Pumped Storage Hydroelectricity:
          offer_floor: 106.0
        battery:
          offer_floor: 69.0
        embedded_solar:
          offer_price: 500.0
        embedded_wind:
          offer_price: 500.0
        gas_engine:
          offer_markup: 0.6
        large_hydro:
          bid_price: -15.0
          offer_price: 110.0
        oil:
          offer_markup: 0.6
        pumped_hydro:
          offer_floor: 106.0
        solar_pv:
          offer_price: 500.0
        wind_offshore:
          offer_price: 500.0
        wind_onshore:
          offer_price: 500.0
      hydrogen_links:
        # Hydrogen turbines get no DPA variable payment: the government's hydrogen-to-power response (DESNZ,
        # Dec 2024, p.29) has not adopted one and says one "could create market distortions". They are in the BM at
        # their resource cost, (hydrogen value + link cost) / efficiency, as every other hydrogen link is; their DPA
        # is an availability payment only (support_regime_2050.json dpa.variable_payment_carriers).
        dpa_pricing:
          enabled: false
          carriers: [H2_turbine]
  support:
    bm_bids:
      enabled: true
      # Supported renewables do not offer up.
      cfd:
        offer_price: 500.0
      roc:
        offer_price: 500.0
      contract_value_bids:
        enabled: true
        # at 0, supported renewables do not offer up. The contract value is floored at zero (2030 has no floor): the
        # label stack implements only the floor, and it binds in 6-9% of hours, about GBP 0.7 m a year in 2050.
        negative_price_rule: none
        cfd_offer_price: 500.0
        contract_value_floor: zero
        merchant:
          bid_price: 0.0
          carriers: [wind_onshore, wind_offshore, solar_pv, embedded_wind, embedded_solar]
        turn_up_floor_gbp_per_mwh: 2.0
        support_labels:
          file: resources/market/FES25_HT_2040_support_labels.csv
          register_group: fes_ht_2040
          # The register group's stock-flow rule, as in public_ownership.reference_run_groups.fes_ht_2040.
          fleet_vintages:
            pathway: Holistic Transition
            retirement_rule: strict_economic_life
            life_source: central
            join_mode: pro_rata
            life_overrides:
              Onshore wind: 25
            refurbishment:
              technologies: [Hydropower, Pumped hydro energy storage (PHES)]
              first_year: 2026
              last_year: 2045
              # Pumped storage is being refurbished now (ENGIE Dinorwig/Ffestiniog programme to ~2036; Cruachan
              # units 2026-27); SSE refurbishes conventional hydro one station at a time (Tummel 2022-24, Lochay
              # 2025-28), which fits the even 2026-2045 schedule.
              windows:
                Pumped hydro energy storage (PHES): [2026, 2036]
            no_cfd_on_repowering: [Solar PV]
            evidence_exclude_countries: [Northern Ireland]
            evidence_stale_records: data/public_ownership/financing/repd_stale_records_2050.csv
          strike_variant: calibrated
          dpa_carriers: [CCS Gas]

# Gas CCS dispatches in Stage 1 on its DPA terms, from the rate-free DPA table.
ht40_dpa_dispatch:
  market:
    wholesale:
      marginal_cost_basis:
        dpa_dispatch:
          enabled: true
          # The rate-free DPA table (rule build_dpa_dispatch): the label table's DPA shares, reference CCGT cost and
          # margin without strikes, so a financing-rate change re-runs only the balancing months, not Stage 1.
          file: resources/market/FES25_HT_2040_dpa_dispatch.csv
          generator_carriers: [CCS Gas]
          # No hydrogen turbines: with no DPA variable payment they dispatch at their resource cost in Stage 1 and
          # the annual pass.
          link_carriers: []
          # Declared hydrogen value (GBP/MWh H2), equal to market.hydrogen_supply_price; unused while link_carriers
          # is empty.
          hydrogen_value_gbp_per_mwh_h2: year_parameter:hydrogen_supply_price_gbp_per_mwh_h2

# CfD bids in the balancing mechanism on the strike basis.
ht40_cfd_bids_at_strike:
  support:
    bm_bids:
      contract_value_bids:
        bid_basis: strike

# The balancing mechanism holds the hydrogen store within a band around its Stage 1 path.
ht40_h2_store_band_stage1:
  market:
    balancing:
      hydrogen_links:
        store_band: stage1

# Central dispatch (overlay config/defaults/dispatch/central.yaml).
# Hydrogen store above the annual trajectory valued 1 GBP/MWh H2 under the end value: the annual
# dual (63.99994) ties with the reformer's hydrogen cost (64.00) within solver tolerance, and the central
# solver profile reformed gas into the store flat out. The market families are solved without it.
ht40_central_dispatch:
  market:
    dispatch: central
    balancing:
      carrier_overrides:
        solar_pv:
          bid_discount: 0.0
          mode: markup
