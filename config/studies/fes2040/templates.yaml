# Templates: named building blocks, composed by `inherits: [...]` (two may not set the same leaf).

# The FES 2025 Holistic Transition 2040 study: data sources, network, costs, demand, fleet, the bill's forecast cases
# and the public-ownership run groups. Every scenario of the study inherits it.
ht40:
  targets: {source: FES, edition: 2025, pathway: HT}
  method: gsp_block
  modelled_year: 2040
  renewables_year: 2013
  demand_year: 2013
  network_model: ETYS
  # labels, support-based dispatch costs and support revenue are off for the FES long-range chain (2040 as 2050). Its support comes
  # from the contract book (contract_book_2050.py) and the label table (build_support_labels), and the vintaged
  # settlement refuses a network that also carries labels ("one source only").
  # effect on dispatch (every post-2025 renewable is at GBP 0 either way). The clean fix is a settlement that reads D4's
  # labels beside the contract book; until then this exception stands.
  support:
    labels: {enabled: false}
    dispatch_costs: {enabled: false}
    revenue: {enabled: false}
  market:
    enabled: true
    wholesale:
      mode: rolling_day_ahead
    balancing:
      mode: rolling
      participation:
        generators:
          min_p_nom_mw: 1.0
          exclude_carriers: [load_shedding, embedded_solar, embedded_wind, EU_import, waste_to_energy, biogas, gas_supply, EV_smart_charging, V2G_fleet, HP_flexibility, DH_flexibility, IC_DSR, residential_DSR, DACCS]
          penalty_offer_price: 6000.0
          penalty_bid_price: 6000.0
        storage_units:
          min_p_nom_mw: 1.0
      window_hours: 24
      bid_offer_source: derived
      participation_audit:
        enabled: true
      interconnector_retrading: true
      fix_interconnectors: false
      carrier_overrides:
        CCS Gas:
          offer_markup: 0.29
          mode: markup
        EV_smart_charging:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        V2G_fleet:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        HP_flexibility:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        DH_flexibility:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        IC_DSR:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        residential_DSR:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
        DACCS:
          mode: absolute
          offer_price: 6000.0
          bid_price: 6000.0
      interconnector_counter_trade:
        enabled: true
        # ic_no_country_caps, ic_premium_20): GBP 20/MWh premium both ways, additive pricing on GB-gas foreign
        # multipliers, no Stage 1 spread gate, no per-country flow caps.
        bid_pricing: additive
        offer_pricing: additive
        foreign_plant_multipliers: gb_gas
        max_deviation_share: 2.0
        max_deviation_share_by_country:
          Belgium: 2.0
          Denmark: 2.0
          France: 2.0
          Germany: 2.0
          Ireland: 2.0
          Netherlands: 2.0
          Northern Ireland: 2.0
          Norway: 2.0
        min_spread_gbp_per_mwh: 0.0
        min_spread_rule: none
        premium_gbp_per_mwh: 20.0
        bid_premium_gbp_per_mwh: 20.0
      # boundaries, storage anchored to its Stage 1 legs, electrolysers and hydrogen turbines held at their Stage 1
      # schedule. Turn-down as solved: subsidy dependent, merchant renewables first, then CfD
      # units by the support they lose (contract-value bids), not pro rata within each zone.
      network_delivery:
        case: fes_2040_as_built
        description: "The FES 2040 network as built; only the outage replay applies"
        secured_capability:
          historic_derate:
            enabled: true
            file: data/network/neso_boundary_outage_generic_2022_25.csv
            mode: replay
            unmapped: default
      storage_anchor: stage1_legs
      hydrogen_links:
        hold_carriers: [H2_turbine, electrolysis]
      turn_down_allocation:
        mode: cheapest_first
    seasonal_pass:
      hydrogen_reserve_twh: year_parameter:hydrogen_reserve_twh
    hydrogen_store:
      end_of_window_value_gbp_per_mwh_h2: year_parameter:hydrogen_end_of_window_value_gbp_per_mwh_h2
      month_end: free
  renewables:
    embedded:
      enabled: false
    # Calibrated per year and pathway in data/FES/fes_year_parameters.csv (with sources); config/config_loader.py
    # substitutes it wherever a value is written "year_parameter:<key>".
    performance_factors:
      factors:
        wind_offshore: year_parameter:performance_factor_wind_offshore
        wind_onshore: year_parameter:performance_factor_wind_onshore
        solar_pv: year_parameter:performance_factor_solar_pv
  network:
    clustering:
      method: custom
      function_path: scripts/network_clustering/neso_zone_busmap.py
      function_name: cluster_buses
      convert_transformers_to_lines: true
      neso_zone_busmap:
        remote_km: 2.0
        cutoff: 6
      secured_capability:
        # Internal HVDC links whose straight path meets a boundary line an even number of times although their
        # ends are on opposite sides (secured_boundaries.find_boundary_crossings counts odd crossings only),
        # declared with their flow sign. EGL3 (LOSD4M-WALP41, 4 GW, 2035) crosses B4 and B5, sign +1.
        include:
          B4: [{component: link, name: DRAX41_PEHE4J_HVDC_2029, sign: -1.0}, {component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
          B5: [{component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
      strategies:
        line:
          voltage_kv: max
          v_nom: max
          s_nom: sum
          length: mean
          length_km: mean
          b: sum
          s_nom_winter: sum
          s_nom_spring: sum
          s_nom_summer: sum
          s_nom_autumn: sum
          etys_licensee: first
          etys_licensee_source: first
          etys_topology_source: first
          cp30_project_code: first
          cp30_source: first
          seasonal_rating_source: first
    transmission:
      outage_schedule:
        enabled: true
        source: secured_capability
        secured_capability:
          fes_pathway: HT
          capability_year: 2040
          # The same declared HVDC crossings as network.clustering.secured_capability.include.
          include:
            B4: [{component: link, name: DRAX41_PEHE4J_HVDC_2029, sign: -1.0}, {component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
            B5: [{component: link, name: LOSD4M_WALP41_HVDC_2035, sign: 1.0}]
          hold_last_year: true
          boundaries: [B1a, B2, B4, B6, B7a, B8, B9, EC5, LE1, SW1, B13]
          branch_scaling:
            enabled: true
            margin: 1.25
    reinforcements:
      enabled: true
      reference_file: resources/CP30/CP30_reference_N1_N2_NA1.csv
      manifest_file: data/network/ETYS/cp30_n1_reinforcement_manifest.csv
      components_file: data/network/ETYS/cp30_n1_accelerated_components.csv
      strict: false
  marginal_costs:
    future_costs:
      enabled: true
      case: fes2025_ht
      carbon_price_support_end: '2028-04-01'
      # Gas CCS on DESNZ Electricity Generation Costs 2025 Annex A: 47% net efficiency and
      # variable O&M of 6 GBP/MWh, plus CO2 transport and storage at the reformer's 34.5 GBP/tCO2
      # (hydrogen.fes.gas_reforming_ccs) on 0.183 x 0.90 / 0.47 = 0.3504 tCO2 captured per MWh (12.09 GBP/MWh):
      # variable O&M 18.09 GBP/MWh. The plant bears the T&S charge at the margin because the DPA's variable payment
      # is floored at zero (BEIS DPA Annex C, 2020, p.29). The 2050 study's method; non-capex components do not vary by commissioning year (Annex A note 9).
      # Short-run cost in 2040: 23.52 / 0.47 = 50.04 fuel + 99.80 x 0.0389 = 3.89 carbon + 18.09 = 72.02 GBP/MWh. Values by year:
      # data/FES/fes_year_parameters.csv.
      efficiency_defaults:
        CCS Gas: year_parameter:ccs_gas_efficiency
      cases:
        fes2025_ht:
          source_file: resources/FES/fes2025_future_costs_2040.json
          fallback_case: central
        central:
          variable_om:
            CCS Gas: year_parameter:ccs_gas_variable_om_gbp_per_mwh
  thermal:
    availability_factors:
      enabled: true
      factors:
        biogas: 0.55
        biomass: 0.8
        nuclear: 0.9
        waste_to_energy: 0.62
      min_output:
        nuclear: 0.5
        # No floor for unabated biomass: the base floor (0.40) protects ROC revenue, and the RO ends in 2037. FES 2025
        # HT ES1 runs 2040 unabated biomass at a 12.6% load factor (1.05 TWh from 0.95 GW).
        biomass: 0.0
        waste_to_energy: 0.35
        biogas: 0.35
        CCS Biomass: 1.0
      min_output_energy_window_hours:
        waste_to_energy: 24
        biogas: 24
    outages:
      enabled: true
    ramping:
      enabled: true
  interconnectors:
    pricing:
      volume_tranches:
        enabled: true
        demand_year: 2040
      foreign_price_source: tyndp
      # Built on TYNDP 2026 draft NT+ 2040 directly: the market's foreign_price_override re-prices every
      # interconnector on NT+ (ht40_tyndp_ntplus2026), and re-pricing on the build's own variant reproduces the
      # built links exactly, so this equals 2050's DE build plus override. TYNDP 2024 DE 2040 is not held.
      tyndp:
        scenario: NTplus2026
        route: tyndp_shape
      foreign_price_basis: single
      single_price_level_offsets_gbp_per_mwh:
        continent: 0.0
        norway: 0.0
        sem: 0.0
      single_price_transaction_spread_gbp_per_mwh: 30.0
      single_price_export_bid_floor_gbp_per_mwh: 1.0
  FES_year: 2025
  FES_scenario: Holistic Transition
  demand:
    disaggregation:
      components: []
      fes:
        enabled: true
        # Demand above 0.90 x capacity at a bus of 132 kV or below moves to the same site's 275/400 kV bus, as in the
        # CP30 2030 build.
        capacity_redistribution:
          mode: same_site
          capacity_safety_margin: 0.9
          min_supergrid_kv: 275.0
        targets_file: resources/FES/fes2025_holistic_transition_2040_targets.json
        workbook: data/FES/Future Energy Scenarios 2025 Data Workbook V005_0.xlsx
        year_basis: calendar
        demand_basis: system
        residual_allocation: per_bus
        min_share: 1.0e-06
        temperature:
          hdh_base_c: 15.5
        heat_pumps:
          hot_water_share: 0.2
          hot_water_seasonal_amplitude: 0.1
          space_heating_diurnal: [0.75, 0.75, 0.75, 0.75, 0.78, 0.85, 1.1, 1.3, 1.25, 1.1, 0.95, 0.95, 0.95, 0.95, 0.95, 0.98, 1.05, 1.15, 1.2, 1.2, 1.15, 1.05, 0.9, 0.8]
          hot_water_diurnal: [0.3, 0.25, 0.25, 0.25, 0.3, 0.5, 1.0, 2.0, 1.8, 1.3, 0.9, 0.8, 0.8, 0.8, 0.8, 0.8, 0.9, 1.2, 1.6, 1.7, 1.5, 1.3, 0.9, 0.5]
          cop_a: 6.81
          cop_b: 0.121
          cop_c: 0.00063
          space_sink_intercept_c: 40.0
          space_sink_slope: -1.0
          space_sink_min_c: 30.0
          space_sink_max_c: 50.0
          hot_water_sink_c: 50.0
          cop_min: 1.5
          cop_max: 6.0
        district_heat:
          hot_water_share: 0.3
          sink_c: 70.0
          carnot_efficiency: 0.5
          cop_min: 1.5
          cop_max: 4.5
        electric_vehicles:
          residential_weekday: [[0.85, 19.0, 2.0], [0.15, 8.0, 1.5]]
          residential_weekend: [[1.0, 15.0, 3.5]]
          public_weekday: [[0.7, 11.0, 2.5], [0.3, 14.0, 3.0]]
          public_weekend: [[1.0, 13.5, 3.5]]
          depot_weekday: [[1.0, 1.0, 2.5]]
          depot_weekend: [[1.0, 1.0, 2.5]]
          weekend_factor:
            residential: 1.0
            public: 0.8
            depot: 0.6
          driving_weekday: [[0.3, 8.0, 1.5], [0.3, 17.5, 1.5], [0.4, 13.0, 3.0]]
          driving_weekend: [[1.0, 13.0, 3.5]]
          driving_weekend_factor: 0.8
          commercial_flex_share: 0.0
          max_flex_share: 0.95
          charger_kw: 7.0
          battery_kwh: 60.0
          usable_battery_fraction: 0.6
          charge_efficiency: 0.9
          plugged_in_max: 0.9
          # Days of the flexible fleet's driving energy the smart-charging and V2G stores hold, so they shift load
          # within the day (FES FLX1 gives them only as GW at peak; the full battery window would hold about 9 days).
          store_days: 1.0
        v2g:
          enabled: true
          discharge_efficiency: 0.9
          degradation_cost_gbp_per_mwh: 50.0
          bidirectional_charger_kw: 7.0
        heat_pump_flexibility:
          enabled: true
          storage_hours_at_peak: 2.0
          standing_loss_per_hour: 0.02
          compressor_headroom: 1.5
        district_heat_flexibility:
          enabled: true
          storage_hours_at_peak: 12.0
          standing_loss_per_hour: 0.005
          compressor_headroom: 2.0
        # holding_cost_gbp_per_mwh_h: DSR holding cost, GBP/MWh per hour held (PyPSA marginal_cost_storage),
        # marginal_cost / shift_hours = 30 / 2, so a 2-hour hold costs one activation.
        ic_dsr:
          enabled: true
          shift_hours: 2.0
          marginal_cost_gbp_per_mwh: 30.0
          holding_cost_gbp_per_mwh_h: 15.0
        # Residential demand-side response (FES 2025 FLX1 row 105).
        residential_dsr:
          enabled: true
          shift_hours: 2.0
          marginal_cost_gbp_per_mwh: 30.0
          holding_cost_gbp_per_mwh_h: 15.0
        # Storage heaters (FES 2025 FLX1 rows 130 and 155): a one-day store, charged in charge_windows.
        storage_heater_flexibility:
          enabled: true
          # charge_windows: [start, end) hours of the day the heaters may charge; Economy 10 style, night
          # 00-07 plus an afternoon boost 13-16 (Economy 10's evening hours fall in the 16-20 h peak).
          charge_windows: [[0, 7], [13, 16]]
        # Holding cost of every drained unit (EV, V2G, heat pump, district heat, storage heaters, DACCS),
        # GBP/MWh per hour held: a tie-breaker so flat or zero prices do not fill the stores with unused surplus.
        drained_holding_cost_gbp_per_mwh_h: 0.005
        daccs:
          enabled: true
          utilisation: 0.5
          buffer_hours_of_mean_load: 24.0
          sites: [{lat: 53.62, lon: -0.23, name: Humber, share: 0.35}, {lat: 54.62, lon: -1.15, name: Teesside, share: 0.3}, {lat: 57.57, lon: -1.84, name: St Fergus, share: 0.2}, {lat: 53.25, lon: -2.9, name: HyNet North West, share: 0.15}]
        calibration:
          hour: 17
          months: [11, 12, 1, 2, 3]
          coldest_days: 10
  fleet:
    fes_supply:
      enabled: true
      targets_file: resources/FES/fes2025_holistic_transition_2040_targets.json
      thermal:
        technology_carriers:
          CCGTs (non CHP): CCS Gas
        # Gen_BB009 "CCGTs (non CHP)" holds gas CCS and unabated CCGT together; it is split in the year's ES1
        # proportion (all CCS in HT 2050; 19.6 of 25.0 GW in HT 2040).
        gas_ccs_split:
          enabled: true
          technology: CCGTs (non CHP)
          ccs_carrier: CCS Gas
          unabated_carrier: CCGT
        es1_lines_file: resources/FES/fes2025_holistic_transition_2040_es1_lines.csv
        # The year's declared Direct stations (rule build_fes_station_schedule, from
        # data/generators/fes/station_list.csv).
        station_schedule: resources/FES/fes2025_holistic_transition_2040_station_schedule.csv
      offshore_landing:
        file: data/network/ETYS/fes2040_offshore_landing.csv
        projects_file: data/network/ETYS/fes2040_offshore_landing_projects.csv
      storage:
        durations_h:
          CAES: 20.0
        pumped_hydro_sites: data/storage/fes2050_pumped_hydro_sites.csv
      interconnectors:
        capacity_from_scenario_fes_year: true
  solve:
    solver:
      threads: 2
  consumer_bill:
    forecasts:
      cases:
        FES25_HT_2040:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_market
          assumptions: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
        # The private-ownership bill under central dispatch, with no solve of its own. Stage 1 is FES25_HT_2040's
        # market months (the national price is the market twin's copperplate price); the CfD line and the RO are
        # metered on the central-dispatch months (central_scenario_pattern); the constraint line is this case's own
        # FTI settlement (rule build_central_dispatch_case_fti_settlement: cost recovery, firm access with the lost
        # CfD support on this case's contract book, storage and interconnector make-whole, and fes_ht_2040's
        # borrowed forecast-error charge at fleet ratio 2.32); post-AR7 CfDs are at the strike diagnostic's central
        # strikes (central_dispatch_strikes; rules build_central_dispatch_strike_inputs_2050 and
        # build_central_dispatch_contract_book_2050). Held at the market year: the DPA settlement, the LDES floor
        # and the register-booked lines (fes_ht_2040's account). No run group projects through it.
        FES25_HT_2040_cd:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_market
          assumptions: resources/public_ownership/FES25_HT_2040_cd_bill_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
          recovery_case_id: FES25_HT_2040
          institution: central_dispatch
          institution_parent: FES25_HT_2040
          central_scenario_pattern: FES25_HT_2040_{month}_central_dispatch
          fti_settlement: resources/market/FES25_HT_2040_cd_year_fti_settlement_copperplate.csv
          counter_trade_premium_on_constraint_line: true
          central_dispatch_strikes:
            assumptions_from: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
            market_group: fes_ht_2040
            diagnostic: resources/public_ownership/fes_ht_2040_central_dispatch_strike_diagnostic.csv
        FES25_HT_2040_p2_bids_25pct:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_p2_bids_25pct
          assumptions: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040_p2_bids_25pct
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
          recovery_case_id: FES25_HT_2040
        FES25_HT_2040_p2_bids_50pct:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_p2_bids_50pct
          assumptions: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040_p2_bids_50pct
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
          recovery_case_id: FES25_HT_2040
        FES25_HT_2040_p2_bids_75pct:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_p2_bids_75pct
          assumptions: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040_p2_bids_75pct
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
          recovery_case_id: FES25_HT_2040
        FES25_HT_2040_p2_bids_100pct:
          modelled_year: 2040
          model_price_year: 2024
          source_scenario_pattern: FES25_HT_2040_{month}_p2_bids_100pct
          assumptions: data/market/consumer_bill_benchmarks/2040_pypsa_informed_assumptions.json
          recovery_demand_assumptions: data/market/consumer_bill_forecast/2040_recovery_demand_assumptions.json
          annual_aggregate_study: FES25_HT_2040_p2_bids_100pct
          turn_down_network_case: FES25_HT_2040
          ro_scheme_parameters: data/market/consumer_bill_forecast/2040_ro_scheme_parameters.json
          ro_relief_case: scheme_closed
          period_alignment_note: Calendar-2040 snapshot; external lines carry their 2040 period_basis (Y13).
          cfd_recovery:
            method: eligible_supplier_sales
          max_fallback_strike_share_of_payment: null
          recovery_case_id: FES25_HT_2040
  hydrogen:
    fes:
      enabled: true
      targets_file: resources/FES/fes2025_holistic_transition_2040_targets.json
      future_costs_file: resources/FES/fes2025_future_costs_2040.json
      store_standing_loss_per_hour: 0.0
      non_power_demand_basis: calendar
      turbine_variable_om_gbp_per_mwh: 5.0
      electrolysis_variable_om_gbp_per_mwh: 0.0
