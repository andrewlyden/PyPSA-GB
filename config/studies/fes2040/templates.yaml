            fleet_ratio: 1.527
            price_year: 2024
        sensitivities:
          # case), less what a vintaged register cannot carry, plus the 2050 cases below.
          extend_global:
            drop_levers: [balancing_bids, capacity_procurement]
            drop_named: []
            drop_preset_parents: [public_ownership@state_bids_at_cost]
            # Compromise: Scenario 3's bound grid on its four largest drivers (2 x 3 x 2 x 2).
            bound_grid_axes:
              public_ownership@fully_nationalised_market_value: [wacc, premium, rate-pwlb-standard, price-state-value]
          bounding_pair: false
          # One at a time: P2 at state deployment shares of 25-100%; the private rate path on NESO's wind ramp; the
          # public rate at PWLB standard (workbook v2.0's lending-margin stress); the state's plant paid in the full
          # Capacity Market auction (today's treatment); pre-2025 CfDs, HPC's included, owned and re-priced by the
          # state (centrally P2 owns only plant contracted after the policy date).
          one_at_a_time: [{state_deployment_share: ['0.25', '0.50', '0.75', '1.00']}, {private_rate_path: [neso_wind_ramp]}, {public_rate_basis: [pwlb_standard]}, {capacity_market_design: [market_participant]}, {pre_2025_cfd_capacity: [public_repriced]}]
          named:
