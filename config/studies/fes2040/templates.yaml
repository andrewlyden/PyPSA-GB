        acquisition_from_group: cp30_2030_no_acceleration
        mode: twelve_months
        scenario_pattern: FES25_HT_2040_{month}_market
        forecast_case: FES25_HT_2040
        fleet_vintages:
          pathway: Holistic Transition
          # At its economic life a site is repowered as new build of that year (public under P2 once the law is in
          # force); no private life extension. Today's extension rule (onshore 30% repowered at 25, the rest to 35)
          # is the fes_ht_2040_retirement_bound group.
          retirement_rule: strict_economic_life
          life_source: central
          join_mode: pro_rata
          life_overrides:
            Onshore wind: 25
          # Hydro and pumped hydro are refurbished, not rebuilt: cohorts already past their life in 2024 are
          # refurbished oldest first, evenly over first_year to last_year.
          refurbishment:
            technologies: [Hydropower, Pumped hydro energy storage (PHES)]
            first_year: 2026
            last_year: 2045
            # Pumped storage is being refurbished now (ENGIE Dinorwig/Ffestiniog programme to ~2036; Cruachan
            # units 2026-27); SSE refurbishes conventional hydro one station at a time (Tummel 2022-24, Lochay
            # 2025-28), which fits the even 2026-2045 schedule.
            windows:
              Pumped hydro energy storage (PHES): [2026, 2036]
          no_cfd_on_repowering: [Solar PV]
          evidence_exclude_countries: [Northern Ireland]
          evidence_stale_records: data/public_ownership/financing/repd_stale_records_2050.csv
        vintage_costs:
          enabled: true
          table: data/public_ownership/financing/technology_costs_vintage.csv
          insurance: exclude
          learning: false
          # Refurbishment capex as a share of new-build capex (FES 2025 E.03). Sources: SSE Tummel Bridge
          # GBP 50m/40 MW (Sep 2024) and Lochay GBP 70m/45 MW (Feb 2025), life +40 y; ENGIE Dinorwig ~GBP 300m for
          # 2 x 288 MW (NCE, Mar 2026) and Dinorwig/Ffestiniog ~EUR 1.2bn for 2.1 GW (ENGIE, Jul 2025).
          refurbishment_capex_share:
            Hydropower: 0.35
            Pumped hydro energy storage (PHES): 0.3
        institution_comparison:
          central_scenario_pattern: FES25_HT_2040_{month}_central_dispatch
