# Month families: one entry per family, expanded by the loader into one scenario per month.

# The 2020 market validation months, with each month's renewable performance factors.
validation:
  inherits: validation_2020
  id: Validation_{Mon}{year}
  solve_period:
    enabled: true
  market:
    balancing:
      participation:
        generators:
          min_p_nom_mw: 1.0
          exclude_carriers: [load_shedding, embedded_solar, embedded_wind]
          hold_carriers: [embedded_solar, embedded_wind]   # not BM units in 2020: held at Stage 1
          penalty_offer_price: 6000.0
          penalty_bid_price: 6000.0
          behavior: fallback_priced
      window_hours: 24
      elexon:
        price_ladders:
          enabled: true
  renewables:
    embedded:
      wind_overlap_exclusion:
        enabled: true
    performance_factors:
      factors:
        wind_offshore: 0.638858
        wind_onshore: 0.840498
        solar_pv: 0.678725
    hydro:
      large_hydro:
        roc_hydro_supplement_file: data/market/ofgem_renewables_obligation/dukes_2020_roc_hydro_supplement.csv
  network:
    transmission:
      outage_schedule:
        neso:
          # SSHARN on the ETYS B7a cut
          boundary_include: [SCOTEX, SSE-SP, 'SSHARN::SSHARN_B7A', ESTEX, SEIMP, SWALEX]
          boundary_mapping: data/network/neso_boundary_mapping_ssesp_strict.yaml
          soft_boundaries:
            SEIMP:
              enabled: true
              penalty_gbp_per_mwh: 1000.0
              max_violation_mw: 2500.0
      line_rating_overrides: null
      declared_link_outages:
      - link: FLIB41_HUCS4-_0          # Western HVDC link (Hunterston - Flintshire Bridge)
        start: '2020-01-10'
        end: '2020-02-08'
        source: >-
          cable trip 10 Jan 2020, back 8 Feb 2020 (Ofgem investigation into the Western HVDC link, 28 Jan 2020;
          Cornwall Insight, Feb 2020: record GBP 30.9m of wind turn-down during the outage)
  support:
    labels:
      dispatchable_support_overrides_file: data/market/support/generator_support_overrides_2020.csv
      renewable_support_overrides_file: data/market/support/renewable_support_overrides_2020.csv
      historical_station_unit_splits_file: data/market/ofgem_renewables_obligation/historical_station_unit_splits_2020.csv
      historical_cfd_tranches:
        enabled: true
        mapping_file: data/market/lccc/cfd_pypsa_mapping_overrides_2020.csv
        actuals_file: data/market/lccc/actual_cfd_generation_and_payments.csv
      historical_roc_station_labels:
        enabled: true
        registry_file: data/market/ofgem_renewables_obligation/accredited_stations_ro_current.csv
        station_overrides_file: data/market/ofgem_renewables_obligation/roc_pypsa_mapping_overrides_2020.csv
        residual_representation_assumptions_file: data/market/ofgem_renewables_obligation/roc_residual_representation_assumptions_2020.csv
        residual_output_calibration_file: data/market/ofgem_renewables_obligation/roc_residual_output_calibration_2020.csv
      historical_roc_physical_overlay:
        enabled: true
        actions_file: data/market/ofgem_renewables_obligation/roc_historical_overlay_actions_2020.csv
        permitted_actions: [split_existing_asset_roc_and_non_roc, add_missing_phase_and_link_existing_assets]
  marginal_costs:
    biofuel_subsidy:
      require_support_label: true
  thermal:
    availability_factors:
      generator_monthly_file: data/market/support/generator_monthly_availability_2020.csv
    dispatch_anchors:
      enabled: true
      carriers: [coal]
  timestep_minutes: 30
  month_overrides:
    Feb:
      renewables:
        performance_factors:
          factors:
            wind_offshore: 0.623714
            wind_onshore: 0.820575
            solar_pv: 0.735329
      solve_period:
        start: 2020-02-01 00:00
        end: 2020-02-29 23:30
