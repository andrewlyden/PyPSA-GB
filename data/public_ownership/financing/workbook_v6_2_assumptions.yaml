variants:
  base:
    description: the workbook as saved (parity check against its cached values)
    switches: []
  erp_fixed_tmr:
    description: private rates at Fixed TMR (CEPA / UKRN), the workbook's co-equal
      ERP case
    switches:
    - sheet: Assumptions
      cell: B10
      value: Fixed TMR (CEPA / UKRN)
  margin_pwlb_hra:
    description: state cash rate at the PWLB HRA margin (+40 bp)
    switches:
    - sheet: Sc4 Operative
      cell: B5
      value: PWLB HRA (+40bp)
  margin_pwlb_certainty:
    description: state cash rate at the PWLB certainty margin (+80 bp)
    switches:
    - sheet: Sc4 Operative
      cell: B5
      value: PWLB certainty (+80bp)
  margin_pwlb_standard:
    description: state cash rate at the PWLB standard margin (+100 bp)
    switches:
    - sheet: Sc4 Operative
      cell: B5
      value: PWLB standard (+100bp)
  margin_gilt_flat:
    description: state cash rate at the gilt yield (no margin)
    switches:
    - sheet: Sc4 Operative
      cell: B5
      value: Gilt flat (0bp)
  premium_none:
    description: economic rate without a systematic-risk premium (pure Arrow-Lind,
      Green Book)
    switches:
    - sheet: Sc4 Operative
      cell: B6
      value: None (pure Arrow-Lind)
  premium_flat_10:
    description: economic rate at a flat 1% (the Green Book Discount Rate Review's
      recommendation, para 55)
    switches:
    - sheet: Sc4 Operative
      cell: B7
      value: 0.01
  premium_beta_20:
    description: economic rate at 2% per unit of CEPA asset beta (France, Quinet 2013;
      v5's central)
    switches:
    - sheet: Sc4 Operative
      cell: B7
      value: 0.02
    - sheet: Sc4 Operative
      cell: B10
      value: CEPA asset beta
  premium_market_erp_beta:
    description: economic rate at the market ERP per unit of CEPA asset beta (the
      Market Economy Investor Principle bound)
    switches:
    - sheet: Sc4 Operative
      cell: B6
      value: Market ERP (operative)
    - sheet: Sc4 Operative
      cell: B10
      value: CEPA asset beta
  fiscal_sc3:
    description: fiscal paths for Scenario 3 (public new build, existing fleet private)
    switches:
    - sheet: Build-Out
      cell: C216
      value: 'Sc3: new build only'
