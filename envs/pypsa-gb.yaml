# this is a modified version of the pypsa-eur environment
name: pypsa-gb
channels:
- conda-forge
- bioconda
dependencies:
- python>=3.11
- pip

# Core PyPSA ecosystem
# pypsa is held below 1.1: 1.2.4 builds the market LPs 2-3x slower and moves the
# BM objective, 1.3 requires pandas 3 (measured 19 Sep 2026). linopy >= 0.9.1
# is deliberate: 0.8.0's CSR-based direct solver transfer halves the time of
# every market window (io_api "direct" in defaults.yaml solver.io_api).
- pypsa>=1.0.7,<1.1
- atlite>=0.3
- linopy>=0.9.1
- powerplantmatching>=0.5.15

# Data processing & analysis
- numpy
- pandas>=2.1
- scipy
- xarray>=2024.03.0,<=2025.09.0
- networkx
- dask

# Geospatial & coordinate systems (CRITICAL - used extensively)
- geopandas>=1
- pyproj>=3.0
- shapely>=2.0,<2.1
- fiona
- rasterio
- rioxarray
- cartopy
- descartes

# Machine learning & clustering
- scikit-learn

# Snakemake workflow
# snakemake is held below 9.14: the rerun rule (config_loader.scenario_param) relies on how
# snakemake.persistence serialises rule params, tested on 9.13; 9.27 restructured that module.
- snakemake-minimal>=9,<9.14
- snakemake-storage-plugin-http>=0.3
- snakemake-executor-plugin-slurm=1.8.0
- snakemake-executor-plugin-cluster-generic
- memory_profiler

# Data I/O
- xlrd
- openpyxl
- pyxlsb
- pytables
- lxml
- yaml
- netcdf4
- libgdal-netcdf
- geojson
- pyarrow

# String matching & fuzzy matching
- levenshtein>=0.27.1
- fuzzywuzzy

# Web & API interactions
- requests
- pypdf
- country_converter
- geopy

# Visualization
- matplotlib
- seaborn
- plotly
- folium                        # maps in the tutorials
- pydeck
- graphviz

# Utilities
- tqdm
- pytz
- jpype1
- proj

# Solvers
- glpk
- pyscipopt

# Documentation generation (Sphinx)
- sphinx>=7.0
- myst-parser>=2.0
- sphinx-copybutton
- sphinx-design
- sphinxcontrib-mermaid
- nbsphinx
- nbsphinx-link
- pandoc
- docutils

# Development & Jupyter
- jupyter
- ipython
- ipykernel
- pre-commit
- ruff
- pylint
- pytest>=8
- pytest-xdist                  # parallel tests: python -m pytest -n auto

- pip:
  - gurobipy==13.0.3
  - highspy
  - tsam>=2.3.1
  - entsoe-py
  - shibuya>=2026.7  # documentation theme (docs/source/conf.py)
