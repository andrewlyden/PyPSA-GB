# The home page's contributors come from GitHub's contributor list on every docs build
# (scripts/utilities/build_contributors.py). This file adds only what GitHub does not give: names for accounts with
# no public display name, roles, and contributors GitHub's list leaves out. Anyone else on GitHub's list appears as a
# code contributor.
repository: andrewlyden/PyPSA-GB

lead: andrewlyden                 # shown first, as lead developer
paper:                            # co-authors of the 2024 PyPSA-GB paper, in the paper's order
  - sunedin
  - iastruthers
  - LukasFrankenQ
  - SebHudson94
  - anshangR

names:
  andrewlyden: Andrew Lyden
  anshangR: Yifan Wang
  marta-uoe: Marta Gorecka
  SebHudson94: Seb Hudson
  sunedin: Wei Sun
  sd34ert: Satria Putra Kanugrahan
  iastruthers: Iain Struthers
  LukasFrankenQ: Lukas Franken
  Lavinjafari: Lavin (Zahra) Jafaripour
  samuelhward: Samuel Ward
  fatihbaltaci: Fatih Baltaci
  lukebennett03: Luke Bennett

extra:                            # contributors GitHub's list leaves out (co-authors of squash-merged pull requests)
  - lukebennett03

exclude:                          # never listed
  - dependabot[bot]
  - github-actions[bot]
